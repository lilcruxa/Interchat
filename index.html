
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>INTERCHAT</title>
<style>
:root{
 --bg:#080d1b;--panel:#111a2d;--panel2:#19243b;
 --text:#f4f7ff;--muted:#9ba9c4;--blue:#397bff;
 --cyan:#27c8ed;--line:#263550;--danger:#ff637c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
button:disabled{opacity:.5}
.hidden{display:none!important}
.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:85px}
.top{position:sticky;top:0;z-index:20;background:#080d1bf2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 15px}
.toprow,.row,.between{display:flex;align-items:center;gap:10px}
.toprow,.between{justify-content:space-between}
.brand{font-weight:950;letter-spacing:1.5px;font-size:21px}
.brand span{color:var(--cyan)}
.iconbtn,.btn,.secondary,.dangerbtn{border-radius:12px;padding:10px 14px;background:var(--panel2)}
.iconbtn{min-width:42px;min-height:42px}
.btn,.primary{background:linear-gradient(120deg,var(--blue),#315bd9);border-radius:12px;padding:11px 16px;font-weight:750}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.dangerbtn{background:#482231;color:#ffb6c2}
.auth{max-width:430px;margin:8vh auto;padding:22px}
.card,.auth,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}
.auth h1{margin-bottom:5px}
.muted,.small{color:var(--muted)}
.muted{font-size:13px}
.small{font-size:12px}
.field,.input,textarea,select{width:100%;background:#0b1426;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:12px;margin:6px 0;outline:none}
.field:focus,.input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
.tabs{display:flex;gap:8px;margin:15px 0}
.tabs button{flex:1;padding:11px;border-radius:11px;background:var(--panel2);color:var(--muted)}
.tabs button.active{background:var(--blue);color:white}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0c1425f5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px max(5px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left))}
.navinner{width:min(760px,100%);display:flex;justify-content:space-around;gap:3px}
.nav button{flex:1;background:transparent;color:var(--muted);font-size:11px;padding:7px 2px;border-radius:12px}
.nav button .ico{display:block;font-size:21px;margin-bottom:2px}
.nav button.active{background:#1c3260;color:white}
.badge{background:var(--danger);color:white;border-radius:20px;padding:1px 6px;font-size:10px}
.sectiontitle{font-size:20px;margin:8px 0 14px}
.stories{display:flex;gap:13px;overflow-x:auto;padding:5px 0 14px}
.storybubble{flex:0 0 70px;text-align:center;font-size:11px;cursor:pointer}
.storyavatar,.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));font-weight:800;flex-shrink:0}
.storyavatar{width:58px;height:58px;margin:0 auto 5px;padding:3px;border:2px solid #60a7ff}
.storyavatar span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--panel2)}
.composer textarea{min-height:75px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0;overflow:hidden}
.posthead{display:flex;align-items:center;gap:10px}
.postbody{white-space:pre-wrap;overflow-wrap:anywhere;margin:13px 0}
.postmedia img,.postmedia video{display:block;width:100%;max-height:520px;object-fit:contain;background:#050912;border-radius:12px}
.postmeta{font-size:12px;color:var(--muted);margin:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.actions button{background:transparent;color:var(--muted);padding:8px;border-radius:9px;font-size:13px}
.actions button:active{background:var(--panel2)}
.liked{color:#ff668b!important}
.profilehead{display:flex;gap:14px;align-items:center}
.profilepic{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-size:25px;font-weight:800}
.stats{display:flex;gap:24px;margin:17px 0}
.stats b{display:block;font-size:19px}
.profilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.profilegrid img,.profilegrid video{width:100%;aspect-ratio:1;object-fit:cover;background:var(--panel2);border-radius:5px}
.griditem{position:relative;cursor:pointer;overflow:hidden}
.griditem .gridtext{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;padding:7px;text-align:center;font-size:12px;overflow:hidden}
.chatrow,.notice,.comment{padding:12px 5px;border-bottom:1px solid var(--line)}
.chatrow{display:flex;align-items:center;gap:10px;cursor:pointer}
.chatrow .chatinfo{flex:1;min-width:0}
.chatwindow{display:flex;flex-direction:column;height:65vh}
.messages{flex:1;overflow:auto;padding:10px}
.bubble{max-width:82%;padding:10px 13px;border-radius:15px;margin:7px 0;background:var(--panel2);overflow-wrap:anywhere}
.bubble.mine{margin-left:auto;background:#2458b9}
.chatcompose{display:flex;gap:7px;padding-top:8px}
.chatcompose input{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
#modalRoot:empty{display:none}
.modalbg{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);width:min(620px,100%);max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}
.modalhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-17px;background:var(--panel);padding:7px 0 12px;z-index:2}
.commentlist{max-height:55vh;overflow:auto}
.comment{display:flex;gap:10px;align-items:flex-start}
.commenttext{flex:1;overflow-wrap:anywhere}
.commentform{display:flex;gap:7px;align-items:center;position:sticky;bottom:-17px;background:var(--panel);padding:10px 0 calc(8px + env(safe-area-inset-bottom))}
.commentform input{flex:1;min-width:0}
.storyview{min-height:55vh;background:#050912;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.storyview img,.storyview video{max-width:100%;max-height:55vh;object-fit:contain}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#233858;color:white;padding:11px 17px;border-radius:12px;z-index:200;max-width:90%;text-align:center}
@media(min-width:650px){.modalbg{align-items:center;padding:20px}.modal{border-radius:20px;max-height:85vh}}
</style>
</head>
<body>

<section id="authView" class="auth card">
 <div class="brand">INTER<span>CHAT</span></div>
 <h1 id="authHeading">Welcome back</h1>
 <p class="muted">CONNECT. DISCOVER. EXPRESS.</p>
 <div class="tabs">
  <button id="loginTab" class="active">Sign in</button>
  <button id="signupTab">Create account</button>
 </div>
 <form id="authForm">
  <input id="authName" class="field hidden" placeholder="Display name" autocomplete="name">
  <input id="authEmail" class="field" type="email" placeholder="Email address" required autocomplete="email">
  <input id="authPassword" class="field" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
  <button id="authSubmit" class="btn" style="width:100%">Sign in</button>
 </form>
 <p id="authMessage" class="small"></p>
</section>

<div id="appView" class="app hidden">
 <header class="top">
  <div class="toprow">
   <div class="brand">INTER<span>CHAT</span></div>
   <div class="row">
    <button class="iconbtn" id="searchBtn" aria-label="Search">⌕</button>
    <button class="iconbtn" id="createBtn" aria-label="Create">＋</button>
    <button class="iconbtn" id="notifBtn" aria-label="Notifications">♧ <span id="notifBadge"></span></button>
   </div>
  </div>
 </header>
 <main id="main" style="padding:12px"></main>
 <nav class="nav">
  <div class="navinner" id="nav">
   <button data-page="home" class="active"><span class="ico">⌂</span>Home</button>
   <button data-page="discover"><span class="ico">⌕</span>Discover</button>
   <button data-page="videos"><span class="ico">▷</span>Videos</button>
   <button data-page="chat"><span class="ico">▣</span>Chat</button>
   <button data-page="profile"><span class="ico">◉</span>Profile</button>
  </div>
 </nav>
</div>
<div id="modalRoot"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,query,where,orderBy,limit,getDocs,onSnapshot,serverTimestamp,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDjKlQjHuzQgDIqOHF_0fLJuqfL9701cJc",
 authDomain:"interchat-c1cfc.firebaseapp.com",
 projectId:"interchat-c1cfc",
 storageBucket:"interchat-c1cfc.firebasestorage.app",
 messagingSenderId:"583165274280",
 appId:"1:583165274280:web:cab44e35230adc157a7a9d"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"U").trim().slice(0,1).toUpperCase();
const validUrl=u=>/^https:\/\/\S+$/i.test(u||"");
let user=null,profile=null,page="home",viewedProfile=null;
let feedPosts=[],storyPosts=[],notifications=[],savedIds=[];
let feedUnsub=null,storyUnsub=null,notifUnsub=null,commentUnsub=null,messageUnsub=null;
let currentChat=null,chatUnsubs=[],chatList=[];
let signup=false,toastTimer=null;

function toast(message){
 let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}
 el.textContent=message;el.classList.remove("hidden");
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),2800);
}
function stopListeners(){
 [feedUnsub,storyUnsub,notifUnsub,commentUnsub,messageUnsub,...chatUnsubs].forEach(fn=>{if(typeof fn==="function")fn()});
 feedUnsub=storyUnsub=notifUnsub=commentUnsub=messageUnsub=null;
 chatUnsubs=[];currentChat=null;
}
function setAuthMode(isSignup){
 signup=isSignup;
 $("loginTab").classList.toggle("active",!signup);
 $("signupTab").classList.toggle("active",signup);
 $("authName").classList.toggle("hidden",!signup);
 $("authName").required=signup;
 $("authHeading").textContent=signup?"Create your account":"Welcome back";
 $("authSubmit").textContent=signup?"Create account":"Sign in";
 $("authPassword").autocomplete=signup?"new-password":"current-password";
 $("authMessage").textContent="";
}
$("loginTab").onclick=()=>setAuthMode(false);
$("signupTab").onclick=()=>setAuthMode(true);

$("authForm").onsubmit=async e=>{
 e.preventDefault();$("authMessage").textContent="Please wait…";
 try{
  const email=$("authEmail").value.trim(),password=$("authPassword").value;
  if(signup){
   const name=$("authName").value.trim();
   if(!name)throw Error("Enter your display name.");
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(cred.user,{displayName:name});
   const username=name.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20)||"member";
   await setDoc(doc(db,"users",cred.user.uid),{
    uid:cred.user.uid,displayName:name,username,bio:"",
    following:[],savedPostIds:[],createdAt:serverTimestamp()
   });
  }else await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("authMessage").textContent=authError(e)}
};
function authError(e){
 if(e.code==="auth/api-key-not-valid")return"Firebase API key is not valid. Check Project settings → Your apps.";
 if(e.code==="auth/unauthorized-domain")return"Add this website domain in Firebase Authentication → Settings → Authorized domains.";
 if(e.code==="auth/email-already-in-use")return"That email already has an account. Sign in instead.";
 if(e.code==="auth/weak-password")return"Choose a stronger password with at least 6 characters.";
 return e.message||"Something went wrong.";
}

onAuthStateChanged(auth,async u=>{
 stopListeners();user=u;
 if(!u){
  $("authView").classList.remove("hidden");$("appView").classList.add("hidden");return;
 }
 try{
  await loadMyProfile();
  $("authView").classList.add("hidden");$("appView").classList.remove("hidden");
  startStreams();go("home");
 }catch(e){$("authMessage").textContent="Could not load your profile: "+e.message}
});
async function loadMyProfile(){
 const ref=doc(db,"users",user.uid),s=await getDoc(ref);
 if(!s.exists()){
  const name=user.displayName||user.email?.split("@")[0]||"User";
  await setDoc(ref,{uid:user.uid,displayName:name,username:name.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,20)||"member",bio:"",following:[],savedPostIds:[],createdAt:serverTimestamp()});
  profile=(await getDoc(ref)).data();
 }else profile=s.data();
 profile.uid=user.uid;savedIds=profile.savedPostIds||[];
}
function startStreams(){
 feedUnsub=onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(100)),s=>{
  feedPosts=s.docs.map(d=>({id:d.id,...d.data()}));render();
 },e=>toast("Feed error: "+e.message));
 storyUnsub=onSnapshot(query(collection(db,"posts"),where("type","==","story"),orderBy("createdAt","desc"),limit(100)),s=>{
  const now=Date.now();
  storyPosts=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>{
   const exp=p.expiresAt?.toDate?p.expiresAt.toDate().getTime():Number(p.expiresAt||0);
   return exp>now;
  });render();
 },e=>console.warn("Story stream",e));
 notifUnsub=onSnapshot(query(collection(db,"notifications"),where("userId","==",user.uid),orderBy("createdAt","desc"),limit(50)),s=>{
  notifications=s.docs.map(d=>({id:d.id,...d.data()}));renderBadges();
 },e=>console.warn("Notifications",e));
}
function renderBadges(){
 const n=notifications.filter(x=>!x.read).length;
 $("notifBadge").innerHTML=n?`<span class="badge">${n}</span>`:"";
}
function go(next){
 page=next;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 render();
}
$("nav").onclick=e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)};
$("createBtn").onclick=()=>createPostModal();
$("searchBtn").onclick=()=>go("discover");
$("notifBtn").onclick=()=>go("notifications");

function render(){
 if(!user)return;
 const main=$("main");
 if(page==="home")main.innerHTML=homeHTML();
 else if(page==="discover")main.innerHTML=discoverHTML();
 else if(page==="videos")main.innerHTML=videosHTML();
 else if(page==="chat")main.innerHTML=chatHTML();
 else if(page==="profile")main.innerHTML=profileHTML(viewedProfile||profile);
 else if(page==="notifications")main.innerHTML=notificationsHTML();
 else if(page==="settings")main.innerHTML=settingsHTML();
 else if(page==="saved")main.innerHTML=savedHTML();
 bindRendered();
 renderBadges();
}
function homeHTML(){
 return `<h2 class="sectiontitle">Your world</h2>
 <div class="stories">${storyHTML()}</div>
 <section class="card composer">
  <div class="row">${avatar(profile.displayName)}<b>Share something with your people</b></div>
  <textarea id="quickText" placeholder="What's happening?"></textarea>
  <div class="between"><span class="small">Text, photos and videos</span><button class="btn" id="quickPublish">Post</button></div>
 </section>
 <div id="feed">${feedPosts.filter(p=>p.type!=="story").map(postHTML).join("")||'<div class="empty">Your feed is ready. Be the first to post!</div>'}</div>`;
}
function avatar(name){return `<div class="avatar">${esc(initials(name))}</div>`}
function storyHTML(){
 const groups=new Map();
 storyPosts.forEach(s=>{if(!groups.has(s.userId))groups.set(s.userId,[]);groups.get(s.userId).push(s)});
 let html=`<div class="storybubble" data-action="create-story"><div class="storyavatar"><span>＋</span></div>Your story</div>`;
 for(const [uid,items] of groups){
  if(uid===user.uid)continue;
  html+=`<div class="storybubble" data-story-user="${esc(uid)}"><div class="storyavatar"><span>${esc(initials(items[0].displayName))}</span></div>${esc(items[0].displayName||"User")}</div>`;
 }
 return html;
}
function mediaHTML(p){
 if(!p.mediaUrl||!validUrl(p.mediaUrl))return "";
 const video=p.mediaType==="video"||p.type==="video";
 return `<div class="postmedia">${video?`<video controls playsinline preload="metadata" src="${esc(p.mediaUrl)}"></video>`:`<img loading="lazy" src="${esc(p.mediaUrl)}" alt="Post media">`}</div>`;
}
function postHTML(p){
 const liked=(p.likes||[]).includes(user.uid),saved=savedIds.includes(p.id);
 const isMine=p.userId===user.uid;
 return `<article class="post" id="post-${esc(p.id)}">
  <div class="posthead">
   ${avatar(p.displayName)}
   <div style="flex:1;min-width:0"><b>${esc(p.displayName||"User")}</b><div class="muted">@${esc(p.username||"member")}</div></div>
   <button class="secondary" data-profile="${esc(p.userId)}">Profile</button>
   ${isMine?`<button class="secondary" data-delete-post="${esc(p.id)}">•••</button>`:""}
  </div>
  ${p.text?`<div class="postbody">${esc(p.text)}</div>`:""}
  ${mediaHTML(p)}
  <div class="postmeta">${(p.likes||[]).length} likes · ${p.commentCount||0} comments</div>
  <div class="actions">
   <button class="${liked?"liked":""}" data-like="${esc(p.id)}">${liked?"♥":"♡"} Like</button>
   <button data-comments="${esc(p.id)}">▢ Comment</button>
   <button data-repost="${esc(p.id)}">↻ Repost</button>
   <button data-save="${esc(p.id)}">${saved?"✓ Saved":"☆ Save"}</button>
   <button data-share="${esc(p.id)}">↗ Share</button>
  </div>
 </article>`;
}
function discoverHTML(){
 return `<h2 class="sectiontitle">Discover</h2>
 <input id="peopleSearch" class="field" placeholder="Search people by name or username">
 <div id="peopleResults"></div>
 <h3>Recent posts</h3>${feedPosts.filter(p=>p.type==="post").map(postHTML).join("")||'<div class="empty">No posts to discover yet.</div>'}`;
}
function videosHTML(){
 const videos=feedPosts.filter(p=>p.type==="video");
 return `<h2 class="sectiontitle">Watch</h2><p class="muted">Videos shared by the INTERCHAT community.</p>
 ${videos.map(postHTML).join("")||'<div class="empty">No videos yet. Share the first one!</div>'}
 <button class="btn" id="createVideo">＋ Share a video</button>`;
}
function profileHTML(p){
 if(!p)return '<div class="empty">Profile unavailable.</div>';
 const mine=p.uid===user.uid;
 const own=feedPosts.filter(x=>x.userId===p.uid&&x.type!=="story");
 const media=own.filter(x=>x.mediaUrl&&["image","video"].includes(x.mediaType|| (x.type==="video"?"video":"image")));
 const textPosts=own.filter(x=>!x.mediaUrl);
 const following=p.following||[];
 const followerCountLabel="Followers";
 return `<section class="card">
  <div class="profilehead"><div class="profilepic">${esc(initials(p.displayName))}</div>
   <div><h2 style="margin:0">${esc(p.displayName||"User")}</h2><div class="muted">@${esc(p.username||"member")}</div></div>
  </div>
  <p>${esc(p.bio||"No bio yet.")}</p>
  <div class="stats">
   <div><b>${own.length}</b><span class="muted">Posts</span></div>
   <div><b id="followerCount">…</b><span class="muted">${followerCountLabel}</span></div>
   <div><b>${following.length}</b><span class="muted">Following</span></div>
  </div>
  ${mine?`<button class="btn" id="editProfile">Edit profile</button>`:
   `<button class="btn" id="followBtn">${following.includes(user.uid)?"Following":"Follow"}</button>
    <button class="secondary" id="messageUser">Message</button>`}
 </section>
 <h3>Photos and videos</h3>
 <div class="profilegrid">${media.map(x=>`<div class="griditem" data-open-post="${esc(x.id)}">${x.mediaType==="video"||x.type==="video"?`<video src="${esc(x.mediaUrl)}" muted></video>`:`<img loading="lazy" src="${esc(x.mediaUrl)}" alt="">`}</div>`).join("")||'<div class="small">No photos or videos yet.</div>'}</div>
 ${mine?`<h3>Your text posts</h3>${textPosts.map(postHTML).join("")||'<div class="empty">No text posts yet.</div>'}`:""}`;
}
function notificationsHTML(){
 return `<h2 class="sectiontitle">Notifications</h2>
 ${notifications.map(n=>`<div class="notice"><b>${esc(n.message||"New activity")}</b><div class="small">${dateLabel(n.createdAt)}</div>${!n.read?`<button class="secondary" data-read-notif="${esc(n.id)}">Mark read</button>`:""}</div>`).join("")||'<div class="empty">You are all caught up.</div>'}`;
}
function settingsHTML(){
 return `<h2 class="sectiontitle">Settings</h2>
 <section class="card">
  <button class="secondary" style="width:100%;margin:5px 0" id="settingsProfile">Edit profile</button>
  <button class="secondary" style="width:100%;margin:5px 0" id="settingsMyProfile">View my profile</button>
  <button class="secondary" style="width:100%;margin:5px 0" id="settingsSaved">Saved posts</button>
  <button class="secondary" style="width:100%;margin:5px 0" id="privacyInfo">Privacy information</button>
  <button class="secondary" style="width:100%;margin:5px 0" id="communityInfo">Community guidelines</button>
  <button class="dangerbtn" style="width:100%;margin:15px 0 5px" id="logoutBtn">Sign out</button>
 </section>
 <p class="small">INTERCHAT · Your world. Your people.</p>`;
}
function savedHTML(){
 const arr=feedPosts.filter(p=>savedIds.includes(p.id));
 return `<h2 class="sectiontitle">Saved posts</h2>${arr.map(postHTML).join("")||'<div class="empty">No saved posts yet.</div>'}`;
}
function chatHTML(){
 return `<h2 class="sectiontitle">Messages</h2>
 <input class="field" id="chatSearch" placeholder="Find someone to chat with">
 <div id="chatPeople"></div>
 <div id="chatList"></div>`;
}
function dateLabel(t){
 const d=t?.toDate?t.toDate():t?new Date(t):null;
 return d&&!isNaN(d)?d.toLocaleString():"";
}
function bindRendered(){
 $("quickPublish")?.addEventListener("click",async()=>{
  const text=$("quickText").value.trim();if(!text)return toast("Write something first.");
  await publishPost({text,type:"post"});
 });
 $("createVideo")?.addEventListener("click",()=>createPostModal("video"));
 $("editProfile")?.addEventListener("click",editProfileModal);
 $("settingsProfile")?.addEventListener("click",editProfileModal);
 $("settingsMyProfile")?.addEventListener("click",()=>{viewedProfile=profile;go("profile")});
 $("settingsSaved")?.addEventListener("click",()=>go("saved"));
 $("logoutBtn")?.addEventListener("click",()=>signOut(auth));
 $("privacyInfo")?.addEventListener("click",()=>openModal("Privacy",`<p>Keep personal information private. Only share information you are comfortable making visible to other signed-in members.</p><p>Use the report option if you see content that concerns you.</p>`));
 $("communityInfo")?.addEventListener("click",()=>openModal("Community guidelines",`<p>Be respectful. Do not harass, threaten, impersonate or share another person's private information.</p><p>Share content you have the right to post. Report content that breaks these guidelines.</p>`));
 $("peopleSearch")?.addEventListener("input",e=>searchPeople(e.target.value));
 $("chatSearch")?.addEventListener("input",e=>searchChatPeople(e.target.value));
 document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));
 document.querySelectorAll("[data-comments]").forEach(b=>b.onclick=()=>openComments(b.dataset.comments));
 document.querySelectorAll("[data-repost]").forEach(b=>b.onclick=()=>repost(b.dataset.repost));
 document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>savePost(b.dataset.save));
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>sharePost(b.dataset.share));
 document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>openProfile(b.dataset.profile));
 document.querySelectorAll("[data-delete-post]").forEach(b=>b.onclick=()=>deletePost(b.dataset.deletePost));
 document.querySelectorAll("[data-story-user]").forEach(b=>b.onclick=()=>openStories(b.dataset.storyUser));
 document.querySelector("[data-action='create-story']")?.addEventListener("click",createStoryModal);
 document.querySelectorAll("[data-open-post]").forEach(b=>b.onclick=()=>{const p=feedPosts.find(x=>x.id===b.dataset.openPost);if(p)openModal("Post",postHTML(p))});
 document.querySelectorAll("[data-read-notif]").forEach(b=>b.onclick=()=>markNotificationRead(b.dataset.readNotif));
 $("followBtn")?.addEventListener("click",toggleFollow);
 $("messageUser")?.addEventListener("click",()=>startChat(viewedProfile));
}
async function publishPost({text="",mediaUrl="",mediaType="",type="post"}){
 try{
  await addDoc(collection(db,"posts"),{
   userId:user.uid,displayName:profile.displayName||"User",username:profile.username||"member",
   text,mediaUrl,mediaType,type,likes:[],commentCount:0,reposts:[],
   createdAt:serverTimestamp(),visibility:"public"
  });
  closeModal();toast(type==="story"?"Story shared":"Post published");
 }catch(e){toast("Could not publish: "+e.message)}
}
function createPostModal(defaultType="post"){
 openModal(defaultType==="video"?"Share a video":"Create a post",`
 <textarea id="newPostText" placeholder="Write something for your community…"></textarea>
 <input id="newPostUrl" class="field" placeholder="Optional HTTPS photo/video URL">
 <select id="newPostMedia" class="field"><option value="">No media</option><option value="image">Photo</option><option value="video">Video</option></select>
 <p class="small">Media uploads are not enabled yet. Paste a publicly accessible HTTPS media URL.</p>
 <button class="btn" style="width:100%" id="publishNewPost">Publish</button>`);
 $("newPostMedia").value=defaultType==="video"?"video":"";
 $("publishNewPost").onclick=async()=>{
  const text=$("newPostText").value.trim(),mediaUrl=$("newPostUrl").value.trim(),mediaType=$("newPostMedia").value;
  if(!text&&!mediaUrl)return toast("Add text or a media URL.");
  if(mediaUrl&&!validUrl(mediaUrl))return toast("Use a valid HTTPS URL.");
  if(mediaUrl&&!mediaType)return toast("Choose whether your media is a photo or video.");
  await publishPost({text,mediaUrl,mediaType,type:mediaType==="video"?"video":"post"});
 };
}
function createStoryModal(){
 openModal("Create a story",`
 <textarea id="storyText" placeholder="Share a moment…"></textarea>
 <input id="storyUrl" class="field" placeholder="Optional HTTPS photo/video URL">
 <select id="storyMedia" class="field"><option value="">Text story</option><option value="image">Photo story</option><option value="video">Video story</option></select>
 <p class="small">Stories disappear from the app after 24 hours. Photo/video stories need a hosted HTTPS URL.</p>
 <button class="btn" style="width:100%" id="publishStory">Share story</button>`);
 $("publishStory").onclick=async()=>{
  const text=$("storyText").value.trim(),mediaUrl=$("storyUrl").value.trim(),mediaType=$("storyMedia").value;
  if(!text&&!mediaUrl)return toast("Add story text or media.");
  if(mediaUrl&&!validUrl(mediaUrl))return toast("Use a valid HTTPS URL.");
  if(mediaType&&!mediaUrl)return toast("Add a media URL.");
  await publishPost({text,mediaUrl,mediaType,type:"story",expiresAt:new Date(Date.now()+86400000)});
 };
}
function openStories(uid){
 const stories=storyPosts.filter(s=>s.userId===uid).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 if(!stories.length)return;
 let index=0;
 const show=()=>{
  const s=stories[index];if(!s){closeModal();return}
  const media=s.mediaUrl?((s.mediaType==="video")?`<video controls autoplay playsinline src="${esc(s.mediaUrl)}"></video>`:`<img src="${esc(s.mediaUrl)}" alt="Story">`):"";
  $("modalRoot").innerHTML=`<div class="modalbg" id="storyShade"><div class="modal">
   <div class="modalhead"><b>${esc(s.displayName||"Story")}</b><button class="secondary" id="closeStory">✕</button></div>
   <div class="storyview">${media}<h3>${esc(s.text||"")}</h3></div>
   <div class="between" style="margin-top:12px"><button class="secondary" id="prevStory" ${index===0?"disabled":""}>Previous</button><span class="small">${index+1} / ${stories.length}</span><button class="btn" id="nextStory">Next</button></div>
   ${uid===user.uid?`<button class="dangerbtn" style="margin-top:12px" id="deleteStory">Delete story</button>`:""}
  </div></div>`;
  $("closeStory").onclick=closeModal;
  $("prevStory").onclick=()=>{index--;show()};
  $("nextStory").onclick=()=>{index++;show()};
  $("deleteStory")?.addEventListener("click",async()=>{if(confirm("Delete this story?")){await deleteDoc(doc(db,"posts",s.id));closeModal();toast("Story deleted")}});
  $("storyShade").onclick=e=>{if(e.target.id==="storyShade")closeModal()};
 };
 show();
}
function openModal(title,content){
 $("modalRoot").innerHTML=`<div class="modalbg" id="modalShade"><section class="modal"><div class="modalhead"><b>${esc(title)}</b><button class="secondary" id="modalClose">✕</button></div>${content}</section></div>`;
 $("modalClose").onclick=closeModal;
 $("modalShade").onclick=e=>{if(e.target.id==="modalShade")closeModal()};
}
function closeModal(){
 if(commentUnsub){commentUnsub();commentUnsub=null}
 $("modalRoot").innerHTML="";
}
async function toggleLike(id){
 const p=feedPosts.find(x=>x.id===id);if(!p)return;
 const liked=(p.likes||[]).includes(user.uid);
 try{
  await updateDoc(doc(db,"posts",id),{likes:liked?arrayRemove(user.uid):arrayUnion(user.uid)});
  if(!liked&&p.userId!==user.uid)await notify(p.userId,`${profile.displayName} liked your post.`);
 }catch(e){toast("Like failed: "+e.message)}
}
async function repost(id){
 const p=feedPosts.find(x=>x.id===id);if(!p)return;
 try{
  await addDoc(collection(db,"posts"),{
   userId:user.uid,displayName:profile.displayName,username:profile.username,
   text:`Reposted from @${p.username||p.displayName}\n${p.text||""}`,
   originalPostId:id,type:"post",likes:[],commentCount:0,reposts:[],createdAt:serverTimestamp()
  });
  if(p.userId!==user.uid)await notify(p.userId,`${profile.displayName} reposted your post.`);
  toast("Reposted to your feed");
 }catch(e){toast("Repost failed: "+e.message)}
}
async function savePost(id){
 const saved=savedIds.includes(id);
 try{
  await updateDoc(doc(db,"users",user.uid),{savedPostIds:saved?arrayRemove(id):arrayUnion(id)});
  savedIds=saved?savedIds.filter(x=>x!==id):[...savedIds,id];
  profile.savedPostIds=savedIds;render();toast(saved?"Removed from saved":"Post saved");
 }catch(e){toast("Save failed: "+e.message)}
}
async function sharePost(id){
 const url=location.href.split("#")[0]+"#post-"+id;
 try{if(navigator.share)await navigator.share({title:"INTERCHAT post",url});else{await navigator.clipboard.writeText(url);toast("Post link copied")}}
 catch(e){toast("Sharing was cancelled or unavailable")}
}
async function deletePost(id){
 if(!confirm("Delete this post?"))return;
 try{await deleteDoc(doc(db,"posts",id));toast("Post deleted")}
 catch(e){toast("Delete failed: "+e.message)}
}
async function notify(userId,message){
 if(!userId||userId===user.uid)return;
 try{await addDoc(collection(db,"notifications"),{userId,actorId:user.uid,message,read:false,createdAt:serverTimestamp()})}
 catch(e){console.warn("Notification could not be saved",e)}
}
async function openComments(id){
 openModal("Comments",`<div class="commentlist" id="commentList"><div class="empty">Loading comments…</div></div>
 <div class="commentform"><input id="commentInput" class="field" placeholder="Write a comment…" maxlength="1000"><button class="btn" id="sendComment">Send</button></div>`);
 const q=query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc"));
 commentUnsub=onSnapshot(q,s=>{
  $("commentList").innerHTML=s.docs.map(d=>{
   const c=d.data();return `<div class="comment">${avatar(c.displayName)}<div class="commenttext"><b>${esc(c.displayName||"User")}</b><div>${esc(c.text)}</div><div class="small">${dateLabel(c.createdAt)}</div>${c.userId===user.uid?`<button class="secondary" data-delete-comment="${esc(d.id)}">Delete</button>`:""}</div></div>`;
  }).join("")||'<div class="empty">No comments yet. Start the conversation.</div>';
  $("commentList").querySelectorAll("[data-delete-comment]").forEach(b=>b.onclick=()=>deleteComment(id,b.dataset.deleteComment));
 },e=>toast("Comments error: "+e.message));
 $("sendComment").onclick=()=>sendComment(id);
 $("commentInput").onkeydown=e=>{if(e.key==="Enter")sendComment(id)};
}
async function sendComment(id){
 const input=$("commentInput"),text=input?.value.trim();if(!text)return;
 const p=feedPosts.find(x=>x.id===id);
 try{
  await addDoc(collection(db,"posts",id,"comments"),{userId:user.uid,displayName:profile.displayName,text,createdAt:serverTimestamp()});
  await updateDoc(doc(db,"posts",id),{commentCount:(p?.commentCount||0)+1});
  if(p&&p.userId!==user.uid)await notify(p.userId,`${profile.displayName} commented on your post.`);
  input.value="";
 }catch(e){toast("Comment failed: "+e.message)}
}
async function deleteComment(postId,commentId){
 if(!confirm("Delete your comment?"))return;
 try{await deleteDoc(doc(db,"posts",postId,"comments",commentId));toast("Comment deleted")}
 catch(e){toast("Could not delete comment: "+e.message)}
}
async function searchPeople(term){
 if(!term.trim()){$("peopleResults").innerHTML="";return}
 try{
  const s=await getDocs(query(collection(db,"users"),limit(100)));
  const matches=s.docs.map(d=>d.data()).filter(p=>
   p.uid!==user.uid&&((p.displayName||"").toLowerCase().includes(term.toLowerCase())||(p.username||"").toLowerCase().includes(term.toLowerCase()))
  );
  $("peopleResults").innerHTML=matches.map(p=>`<div class="chatrow">${avatar(p.displayName)}<div class="chatinfo"><b>${esc(p.displayName)}</b><div class="muted">@${esc(p.username)}</div></div><button class="secondary" data-profile="${esc(p.uid)}">View</button></div>`).join("")||'<div class="empty">No matching people found.</div>';
  $("peopleResults").querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>openProfile(b.dataset.profile));
 }catch(e){toast("Search failed: "+e.message)}
}
async function openProfile(uid){
 if(!uid)return;
 if(uid===user.uid){viewedProfile=profile;go("profile");return}
 try{
  const s=await getDoc(doc(db,"users",uid));
  if(!s.exists())return toast("Profile not found.");
  viewedProfile={...s.data(),uid};go("profile");
  loadFollowerCount(uid);
 }catch(e){toast("Could not open profile: "+e.message)}
}
async function loadFollowerCount(uid){
 try{
  const s=await getDocs(query(collection(db,"users"),where("following","array-contains",uid),limit(500)));
  if($("followerCount"))$("followerCount").textContent=s.size;
 }catch(e){if($("followerCount"))$("followerCount").textContent="—"}
}
async function toggleFollow(){
 const target=viewedProfile;if(!target||target.uid===user.uid)return;
 const following=profile.following||[],isFollowing=following.includes(target.uid);
 try{
  await updateDoc(doc(db,"users",user.uid),{following:isFollowing?arrayRemove(target.uid):arrayUnion(target.uid)});
  profile.following=isFollowing?following.filter(x=>x!==target.uid):[...following,target.uid];
  render();loadFollowerCount(target.uid);
  if(!isFollowing)await notify(target.uid,`${profile.displayName} started following you.`);
 }catch(e){toast("Follow failed: "+e.message)}
}
function editProfileModal(){
 openModal("Edit profile",`
 <input id="editName" class="field" maxlength="40" placeholder="Display name" value="${esc(profile.displayName)}">
 <input id="editUsername" class="field" maxlength="24" placeholder="Username" value="${esc(profile.username)}">
 <textarea id="editBio" class="field" maxlength="180" placeholder="Your bio">${esc(profile.bio||"")}</textarea>
 <button class="btn" style="width:100%" id="saveProfile">Save changes</button>`);
 $("saveProfile").onclick=async()=>{
  const displayName=$("editName").value.trim(),username=$("editUsername").value.trim().replace(/^@/,"").toLowerCase(),bio=$("editBio").value.trim();
  if(!displayName||!username)return toast("Name and username are required.");
  if(!/^[a-z0-9_]{3,24}$/.test(username))return toast("Username must be 3–24 characters: letters, numbers or underscores.");
  try{
   await updateDoc(doc(db,"users",user.uid),{displayName,username,bio});
   profile={...profile,displayName,username,bio};viewedProfile=profile;closeModal();render();toast("Profile updated");
  }catch(e){toast("Profile update failed: "+e.message)}
 };
}
async function markNotificationRead(id){
 try{await updateDoc(doc(db,"notifications",id),{read:true})}
 catch(e){toast("Could not update notification")}
}
async function searchChatPeople(term){
 if(!term.trim()){$("chatPeople").innerHTML="";return}
 try{
  const s=await getDocs(query(collection(db,"users"),limit(100)));
  const matches=s.docs.map(d=>d.data()).filter(p=>p.uid!==user.uid&&(p.displayName||"").toLowerCase().includes(term.toLowerCase())||(p.username||"").toLowerCase().includes(term.toLowerCase()));
  $("chatPeople").innerHTML=matches.map(p=>`<div class="chatrow" data-start-chat="${esc(p.uid)}">${avatar(p.displayName)}<div class="chatinfo"><b>${esc(p.displayName)}</b><div class="muted">@${esc(p.username)}</div></div><button class="secondary">Message</button></div>`).join("")||'<div class="empty">No people found.</div>';
  $("chatPeople").querySelectorAll("[data-start-chat]").forEach(b=>b.onclick=()=>startChat({uid:b.dataset.startChat,...matches.find(x=>x.uid===b.dataset.startChat)}));
 }catch(e){toast("Could not search people")}
}
async function loadChatList(){
 chatUnsubs.forEach(fn=>fn());chatUnsubs=[];
 const q=query(collection(db,"chats"),where("participants","array-contains",user.uid),limit(50));
 const unsub=onSnapshot(q,async s=>{
  const items=await Promise.all(s.docs.map(async d=>{
   const data=d.data(),other=(data.participants||[]).find(x=>x!==user.uid);
   let p={displayName:"User",uid:other};
   if(other){const us=await getDoc(doc(db,"users",other));if(us.exists())p={...us.data(),uid:other}}
   return {id:d.id,other,person:p,lastMessage:data.lastMessage||""};
  }));
  chatList=items;
  if($("chatList"))$("chatList").innerHTML=items.map(x=>`<div class="chatrow" data-open-chat="${esc(x.other)}">${avatar(x.person.displayName)}<div class="chatinfo"><b>${esc(x.person.displayName)}</b><div class="muted">${esc(x.lastMessage)}</div></div><span>›</span></div>`).join("")||'<div class="empty">No conversations yet. Search for someone to start a chat.</div>';
  $("chatList")?.querySelectorAll("[data-open-chat]").forEach(b=>b.onclick=()=>startChat(chatList.find(x=>x.other===b.dataset.openChat)?.person));
 });
 chatUnsubs.push(unsub);
}
async function startChat(person){
 if(!person?.uid)return;
 const other=person.uid,cid=[user.uid,other].sort().join("_");
 currentChat={...person,uid:other,id:cid};
 openModal(person.displayName||"Chat",`<div class="chatwindow"><div class="messages" id="messages"><div class="empty">Loading messages…</div></div><div class="chatcompose"><input id="messageInput" class="field" placeholder="Write a message…"><button class="btn" id="sendMessage">Send</button></div></div>`);
 const chatRef=doc(db,"chats",cid);
 try{await setDoc(chatRef,{participants:[user.uid,other],lastMessage:"",updatedAt:serverTimestamp()},{merge:true})}
 catch(e){toast("Could not start chat: "+e.message);return}
 if(messageUnsub)messageUnsub();
 const q=query(collection(db,"chats",cid,"messages"),orderBy("createdAt","asc"),limit(200));
 messageUnsub=onSnapshot(q,s=>{
  if(!$("messages"))return;
  $("messages").innerHTML=s.docs.map(d=>{
   const m=d.data();return `<div class="bubble ${m.senderId===user.uid?"mine":""}">${esc(m.text)}<div class="small">${dateLabel(m.createdAt)}</div></div>`;
  }).join("")||'<div class="empty">Say hello and start the conversation.</div>';
  $("messages").scrollTop=$("messages").scrollHeight;
 },e=>toast("Messages error: "+e.message));
 $("sendMessage").onclick=sendMessage;
 $("messageInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};
}
async function sendMessage(){
 const input=$("messageInput"),text=input?.value.trim();if(!text||!currentChat)return;
 const cid=currentChat.id;
 try{
  await addDoc(collection(db,"chats",cid,"messages"),{senderId:user.uid,text,createdAt:serverTimestamp()});
  await updateDoc(doc(db,"chats",cid),{lastMessage:text,updatedAt:serverTimestamp()});
  input.value="";
 }catch(e){toast("Message failed: "+e.message)}
}
$("main").addEventListener("click",e=>{
 const p=e.target.closest("[data-profile]");if(p)openProfile(p.dataset.profile);
});
</script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERCHAT</title>
<style>
:root{--bg:#09090f;--panel:#13131c;--panel2:#1b1b26;--text:#f5f5f8;--muted:#a5a5b3;--accent:#8b5cf6;--line:#292936;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:960px;margin:auto;min-height:100vh;padding-bottom:78px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,9,15,.95);z-index:5}.brand{font-weight:900;letter-spacing:1.4px;font-size:21px;color:#b69aff}.top small{color:var(--muted)}main{padding:14px;max-width:720px;margin:auto}.nav{position:fixed;bottom:0;left:0;right:0;background:#11111a;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.navinner{display:flex;width:min(100%,700px);justify-content:space-around;padding:9px 4px}.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:48px}.nav button.active{color:#b69aff}.nav .ico{font-size:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#2dd4bf);display:grid;place-items:center;font-weight:bold;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.input,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:12px;outline:none}.input:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}.btn{background:var(--accent);border-radius:10px;padding:10px 14px;color:white;font-weight:700}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#452329;color:#ffb5b5}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.action{padding:7px 10px;border-radius:9px;background:var(--panel2);font-size:13px}.action.liked{color:#ff7c9d}.posttext{white-space:pre-wrap;line-height:1.5;margin:12px 0}.postmedia{width:100%;max-height:480px;object-fit:contain;background:#000;border-radius:12px;margin-top:10px}.sectiontitle{font-size:20px;margin:6px 0 14px}.stack{display:grid;gap:10px}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.hidden{display:none!important}.auth{max-width:420px;margin:12vh auto;padding:22px}.auth h1{margin-top:0}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:10px;background:var(--panel2);border-radius:9px}.tabs button.active{background:var(--accent)}.userrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.userinfo{display:flex;align-items:center;gap:10px;min-width:0}.chatlist button{width:100%;text-align:left}.chatmessages{height:min(55vh,500px);overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px}.bubble{max-width:82%;padding:10px 12px;border-radius:13px;background:var(--panel2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#493477}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0}.profilehead{text-align:center}.profilehead .avatar{width:76px;height:76px;margin:0 auto 10px}.stats{display:flex;justify-content:center;gap:20px;margin:14px}.stat strong{display:block}.comment{padding:9px 0;border-bottom:1px solid var(--line)}.modalshade{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--panel);border:1px solid var(--line);width:min(100%,600px);max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.light{--bg:#f5f5f7;--panel:#fff;--panel2:#ececf2;--text:#15151b;--muted:#686875;--line:#d9d9e2}.light .top{background:rgba(245,245,247,.95)}.light .nav{background:#fff}.light .bubble.mine{color:white}.status{padding:10px;color:var(--muted);text-align:center}.tag{font-size:11px;color:#b69aff;background:#2a2140;padding:4px 7px;border-radius:6px}.divider{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<div id="authView" class="auth card">
  <div class="brand">INTERCHAT</div><h1 id="authHeading">Welcome back</h1><p class="muted">Connect, share and discover.</p>
  <div class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Create account</button></div>
  <form id="authForm" class="stack"><input class="input hidden" id="authName" placeholder="Display name" autocomplete="name"><input class="input" id="authEmail" type="email" placeholder="Email" required autocomplete="email"><input class="input" id="authPassword" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password"><button class="btn" id="authSubmit">Log in</button></form><div class="divider"></div><button class="btn secondary" id="googleSignIn" type="button">Continue with Google</button><div id="authMessage" class="status"></div>
</div>
<div id="appView" class="hidden">
<header class="top"><div class="brand">INTERCHAT</div><div class="row"><span class="muted" id="topUser"></span><button class="action" id="quickCreate">＋</button></div></header>
<main id="main"></main>
<nav class="nav"><div class="navinner"><button data-page="home" class="active"><span class="ico">⌂</span>Home</button><button data-page="explore"><span class="ico">⌕</span>Explore</button><button data-page="videos"><span class="ico">▶</span>Videos</button><button data-page="chat"><span class="ico">▣</span>Chat</button><button data-page="profile"><span class="ico">◉</span>Profile</button></div></nav>
</div>
<div id="modalRoot"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, orderBy, limit, where, getDocs, onSnapshot, serverTimestamp, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
// Firebase web app configuration previously supplied for the INTERCHAT project. Verify it in Firebase Console > Project settings > Your apps if authentication reports an invalid API key.
const firebaseConfig = {apiKey:"AIzaSyDjKlQjHuzQgDIqOHF_0fLJuqfL9701cJc",authDomain:"interchat-c1cfc.firebaseapp.com",projectId:"interchat-c1cfc",storageBucket:"interchat-c1cfc.firebasestorage.app",messagingSenderId:"583165274280",appId:"1:583165274280:web:cab44e35230adc157a7a9d"};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=s=>document.querySelector(s), main=$('#main'); let user=null, page='home', signup=false, feedUnsub=null, chatUnsub=null, activeChat=null, viewedUser=null, currentProfile=null, savedIds=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=(name='?')=>`<div class="avatar">${esc((name||'?').slice(0,1).toUpperCase())}</div>`;
function status(id,msg){const el=$(id);if(el)el.textContent=msg||''}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderPage()}
$('#loginTab').onclick=()=>{signup=false;$('#loginTab').classList.add('active');$('#signupTab').classList.remove('active');$('#authHeading').textContent='Welcome back';$('#authName').classList.add('hidden');$('#authName').required=false;$('#authSubmit').textContent='Log in';$('#authPassword').autocomplete='current-password'};
$('#signupTab').onclick=()=>{signup=true;$('#signupTab').classList.add('active');$('#loginTab').classList.remove('active');$('#authHeading').textContent='Create your account';$('#authName').classList.remove('hidden');$('#authName').required=true;$('#authSubmit').textContent='Sign up';$('#authPassword').autocomplete='new-password'};
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();status('#authMessage','Please wait…');try{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(signup){const name=$('#authName').value.trim();const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,displayName:name,username:name.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)||'user',email,createdAt:serverTimestamp(),savedPostIds:[],bio:''});}else await signInWithEmailAndPassword(auth,email,password);}catch(err){status('#authMessage',err.message)}});
$('#googleSignIn').onclick=async()=>{status('#authMessage','Connecting to Google…');$('#googleSignIn').disabled=true;try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,provider);}catch(err){status('#authMessage',err.code==='auth/unauthorized-domain'?'This website domain is not authorized in Firebase Authentication.':err.code==='auth/popup-blocked'?'The sign-in popup was blocked. Allow popups and try again.':err.message)}finally{$('#googleSignIn').disabled=false}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('#appView').classList.add('hidden');$('#authView').classList.remove('hidden');if(feedUnsub)feedUnsub();if(chatUnsub)chatUnsub();return}$('#authView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#topUser').textContent=u.displayName||u.email;await ensureUser();setPage(page)});
async function ensureUser(){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);if(!snap.exists())await setDoc(ref,{uid:user.uid,displayName:user.displayName||'User',username:(user.displayName||'user').toLowerCase().replace(/\s/g,'').slice(0,20),email:user.email,createdAt:serverTimestamp(),savedPostIds:[],bio:''},{merge:true});const fresh=await getDoc(ref);currentProfile=fresh.data()||{};savedIds=currentProfile.savedPostIds||[]}
function postCard(p,id){const liked=(p.likes||[]).includes(user.uid),saved=savedIds.includes(id);return `<article class="card"><div class="row between"><div class="userinfo row" onclick="window.interchatProfile('${esc(p.userId)}')" style="cursor:pointer">${avatar(p.displayName)}<div><strong>${esc(p.displayName||'User')}</strong><div class="muted">@${esc(p.username||'user')}</div></div></div><span class="tag">${p.type==='video'?'VIDEO':'POST'}</span></div><div class="posttext">${esc(p.text||'')}</div>${p.mediaUrl? (p.type==='video'?`<video class="postmedia" controls playsinline src="${esc(p.mediaUrl)}"></video>`:`<img class="postmedia" loading="lazy" src="${esc(p.mediaUrl)}" alt="Post media">`):''}<div class="actions"><button class="action ${liked?'liked':''}" onclick="window.interchatLike('${id}')">${liked?'♥':'♡'} ${p.likes?.length||0}</button><button class="action" onclick="window.interchatComments('${id}')">💬 Comments</button><button class="action" onclick="window.interchatRepost('${id}')">↻ Repost</button><button class="action" onclick="window.interchatSave('${id}')">${saved?'✓ Saved':'☆ Save'}</button><button class="action" onclick="window.interchatShare('${id}')">↗ Share</button></div></article>`}
window.interchatLike=async id=>{const ref=doc(db,'posts',id),snap=await getDoc(ref);if(!snap.exists())return;const likes=snap.data().likes||[];await updateDoc(ref,{likes:likes.includes(user.uid)?arrayRemove(user.uid):arrayUnion(user.uid)}).catch(e=>alert(e.message))};
window.interchatSave=async id=>{const ref=doc(db,'users',user.uid),now=savedIds.includes(id);await updateDoc(ref,{savedPostIds:now?arrayRemove(id):arrayUnion(id)});savedIds=now?savedIds.filter(x=>x!==id):[...savedIds,id];renderPage()};
window.interchatRepost=async id=>{const s=await getDoc(doc(db,'posts',id));if(!s.exists())return;const p=s.data();await addDoc(collection(db,'posts'),{userId:user.uid,displayName:user.displayName||'User',username:currentProfile.username||'',text:`Reposted @${p.username||p.displayName}:\n${p.text||''}`,originalPostId:id,type:'post',likes:[],createdAt:serverTimestamp()});alert('Reposted to your feed.')};
window.interchatShare=async id=>{const url=location.href.split('#')[0]+'#post-'+id;if(navigator.share){try{await navigator.share({title:'INTERCHAT post',url})}catch{}}else{await navigator.clipboard.writeText(url);alert('Post link copied.')}};
window.interchatComments=async id=>{const root=$('#modalRoot');root.innerHTML=`<div class="modalshade" onclick="if(event.target===this)window.interchatCloseModal()"><div class="modal"><div class="row between"><h3>Comments</h3><button class="action" onclick="window.interchatCloseModal()">Close</button></div><div id="commentsList" class="stack"></div><form id="commentForm" class="composer"><input class="input" id="commentInput" placeholder="Write a comment…" required maxlength="1000"><button class="btn">Send</button></form></div></div>`;const q=query(collection(db,'posts',id,'comments'),orderBy('createdAt','asc'));onSnapshot(q,s=>$('#commentsList').innerHTML=s.empty?'<div class="empty">No comments yet.</div>':s.docs.map(d=>`<div class="comment"><strong>${esc(d.data().displayName)}</strong><div>${esc(d.data().text)}</div></div>`).join(''));$('#commentForm').onsubmit=async e=>{e.preventDefault();const txt=$('#commentInput').value.trim();if(!txt)return;await addDoc(collection(db,'posts',id,'comments'),{userId:user.uid,displayName:user.displayName||'User',text:txt,createdAt:serverTimestamp()});$('#commentInput').value=''};};
window.interchatCloseModal=()=>$('#modalRoot').innerHTML='';window.interchatProfile=uid=>{viewedUser=uid;page='profile';renderProfile(uid)};
function renderPage(){if(!user)return;if(feedUnsub){feedUnsub();feedUnsub=null}if(chatUnsub){chatUnsub();chatUnsub=null}activeChat=null;main.innerHTML='';if(page==='home'||page==='explore'||page==='videos'){renderFeed(page);return}if(page==='chat'){renderChats();return}if(page==='profile'){renderProfile(user.uid);return}if(page==='create'){renderCreate();return}if(page==='saved'){renderSaved();return}if(page==='settings'){renderSettings();return}}
function renderFeed(kind){const title=kind==='home'?'Your feed':kind==='explore'?'Explore':'Videos';main.innerHTML=`<h2 class="sectiontitle">${title}</h2>${kind==='explore'?`<div class="card"><input class="input" id="searchUsers" placeholder="Search people by name or username…"><div id="searchResults"></div></div>`:''}<button class="card" style="width:100%;text-align:left" onclick="window.interchatCreate()"><span class="muted">What would you like to share?</span>　＋</button><div id="feedList"></div>`;if(kind==='explore')$('#searchUsers').oninput=searchUsers;const q=query(collection(db,'posts'),orderBy('createdAt','desc'),limit(50));feedUnsub=onSnapshot(q,s=>{let docs=s.docs.map(d=>({id:d.id,...d.data()}));if(kind==='videos')docs=docs.filter(p=>p.type==='video');$('#feedList').innerHTML=docs.length?docs.map(p=>postCard(p,p.id)).join(''):`<div class="empty">${kind==='videos'?'No videos yet. Create a post with a video link.':'Nothing here yet—be the first to post!'}</div>`},e=>$('#feedList').innerHTML=`<div class="status">${esc(e.message)}</div>`)}
async function searchUsers(){const term=$('#searchUsers').value.trim().toLowerCase();const box=$('#searchResults');if(term.length<2){box.innerHTML='';return}try{const snap=await getDocs(collection(db,'users'));const matches=snap.docs.map(d=>d.data()).filter(x=>x.uid!==user.uid&&((x.displayName||'').toLowerCase().includes(term)||(x.username||'').toLowerCase().includes(term))).slice(0,15);box.innerHTML=matches.map(u=>`<div class="userrow card"><div class="userinfo">${avatar(u.displayName)}<div><strong>${esc(u.displayName)}</strong><div class="muted">@${esc(u.username)}</div></div></div><button class="btn secondary" onclick="window.interchatProfile('${esc(u.uid)}')">View</button></div>`).join('')||'<div class="muted">No people found.</div>'}catch(e){box.innerHTML=`<div class="muted">${esc(e.message)}</div>`}}
window.interchatCreate=()=>{page='create';renderPage()};
function renderCreate(){main.innerHTML=`<h2 class="sectiontitle">Create a post</h2><form id="postForm" class="card stack"><textarea id="postText" placeholder="Share something with your community…" maxlength="5000"></textarea><input id="postMedia" class="input" placeholder="Optional image/video URL (public URL)"><select id="postType" class="input"><option value="post">Regular post</option><option value="video">Video post (paste a video URL)</option></select><p class="muted small">Media URL support: paste a publicly accessible link. Uploading files directly requires Firebase Storage setup.</p><button class="btn">Publish</button></form>`;$('#postForm').onsubmit=async e=>{e.preventDefault();const txt=$('#postText').value.trim(),media=$('#postMedia').value.trim(),type=$('#postType').value;if(!txt&&!media)return alert('Add text or a media link.');try{await addDoc(collection(db,'posts'),{userId:user.uid,displayName:user.displayName||'User',username:currentProfile.username||'',text:txt,mediaUrl:media,type,likes:[],createdAt:serverTimestamp()});setPage('home')}catch(err){alert('Could not publish: '+err.message)}}}
async function renderProfile(uid){if(feedUnsub){feedUnsub();feedUnsub=null}if(chatUnsub){chatUnsub();chatUnsub=null}main.innerHTML='<div class="status">Loading profile…</div>';try{const s=await getDoc(doc(db,'users',uid));if(!s.exists()){main.innerHTML='<div class="empty">Profile not found.</div>';return}const u=s.data();const own=uid===user.uid;main.innerHTML=`<div class="card profilehead">${avatar(u.displayName)}<h2>${esc(u.displayName||'User')}</h2><div class="muted">@${esc(u.username||'user')}</div><p>${esc(u.bio||'')}</p><div class="stats"><div class="stat"><strong id="postCount">—</strong><span class="muted">Posts</span></div></div>${own?`<div class="actions" style="justify-content:center"><button class="btn secondary" onclick="window.interchatSettings()">Edit profile / Settings</button></div>`:`<div class="actions" style="justify-content:center"><button class="btn" onclick="window.interchatStartChat('${esc(uid)}','${esc(u.displayName||'User')}')">Message</button></div>`}</div><h3>Your posts</h3><div id="profilePosts"></div>`;const pq=query(collection(db,'posts'),where('userId','==',uid),orderBy('createdAt','desc'),limit(30));feedUnsub=onSnapshot(pq,snap=>{$('#postCount').textContent=snap.size;$('#profilePosts').innerHTML=snap.empty?'<div class="empty">No posts yet.</div>':snap.docs.map(d=>postCard(d.data(),d.id)).join('')},err=>$('#profilePosts').innerHTML=`<div class="status">${esc(err.message)}</div>`)}catch(e){main.innerHTML=`<div class="status">${esc(e.message)}</div>`}}
window.interchatSettings=()=>{page='settings';renderPage()};
function renderSaved(){main.innerHTML='<h2 class="sectiontitle">Saved posts</h2><div id="savedList"></div>';if(!savedIds.length){$('#savedList').innerHTML='<div class="empty">You have no saved posts.</div>';return}const ids=[...savedIds];Promise.all(ids.map(id=>getDoc(doc(db,'posts',id)))).then(snaps=>$('#savedList').innerHTML=snaps.filter(s=>s.exists()).map(s=>postCard(s.data(),s.id)).join('')||'<div class="empty">Saved posts are unavailable.</div>')}
function renderSettings(){main.innerHTML=`<h2 class="sectiontitle">Settings</h2><div class="card stack"><h3>Profile</h3><label>Display name</label><input class="input" id="editName" value="${esc(currentProfile.displayName||user.displayName||'')}"><label>Username</label><input class="input" id="editUsername" value="${esc(currentProfile.username||'')}"><label>Bio</label><textarea id="editBio" maxlength="250">${esc(currentProfile.bio||'')}</textarea><button class="btn" id="saveProfile">Save profile</button></div><div class="card stack"><h3>Appearance</h3><button class="btn secondary" id="themeToggle">Switch light/dark theme</button></div><div class="card stack"><button class="btn secondary" onclick="window.interchatSaved()">Saved posts</button><button class="btn secondary" onclick="window.interchatMyProfile()">View my profile</button><button class="btn danger" id="logoutBtn">Log out</button></div>`;$('#saveProfile').onclick=async()=>{const name=$('#editName').value.trim(),uname=$('#editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20),bio=$('#editBio').value.trim();if(!name||!uname)return alert('Name and username are required.');await updateDoc(doc(db,'users',user.uid),{displayName:name,username:uname,bio});await updateProfile(user,{displayName:name});currentProfile={...currentProfile,displayName:name,username:uname,bio};$('#topUser').textContent=name;alert('Profile updated.')};$('#themeToggle').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('interchat-theme',document.body.classList.contains('light')?'light':'dark')};$('#logoutBtn').onclick=()=>signOut(auth);if(localStorage.getItem('interchat-theme')==='light')document.body.classList.add('light')}
window.interchatSaved=()=>setPage('saved');window.interchatMyProfile=()=>setPage('profile');
async function renderChats(){main.innerHTML=`<h2 class="sectiontitle">Chats</h2><div class="card"><input class="input" id="chatSearch" placeholder="Find people to chat with by name or username"><div id="chatSearchResults"></div></div><div id="chatList" class="stack chatlist"></div>`;$('#chatSearch').oninput=async()=>{const term=$('#chatSearch').value.trim().toLowerCase();if(term.length<2){$('#chatSearchResults').innerHTML='';return}try{const snap=await getDocs(collection(db,'users'));const users=snap.docs.map(d=>d.data()).filter(u=>u.uid!==user.uid&&((u.displayName||'').toLowerCase().includes(term)||(u.username||'').toLowerCase().includes(term))).slice(0,10);$('#chatSearchResults').innerHTML=users.map(u=>`<div class="userrow card"><div class="userinfo">${avatar(u.displayName)}<div><strong>${esc(u.displayName)}</strong><div class="muted">@${esc(u.username)}</div></div></div><button class="btn" onclick="window.interchatStartChat('${esc(u.uid)}','${esc(u.displayName||'User')}')">Chat</button></div>`).join('')||'<div class="muted">No matches.</div>'}catch(e){$('#chatSearchResults').textContent=e.message}};const q=query(collection(db,'chats'),where('participants','array-contains',user.uid));chatUnsub=onSnapshot(q,s=>{$('#chatList').innerHTML=s.docs.map(d=>{const c=d.data(),other=(c.participants||[]).find(x=>x!==user.uid),name=c.names?.[other]||'Conversation';return `<button class="card userrow" onclick="window.interchatOpenChat('${d.id}','${esc(other)}','${esc(name)}')"><div class="userinfo">${avatar(name)}<div><strong>${esc(name)}</strong><div class="muted">${esc(c.lastMessage||'Start a conversation')}</div></div></div><span>›</span></button>`}).join('')||'<div class="empty">No conversations yet. Search for someone above.</div>'},e=>$('#chatList').innerHTML=`<div class="status">${esc(e.message)}</div>`)}
window.interchatStartChat=async(uid,name)=>{const ids=[user.uid,uid].sort(),id=ids.join('_'),ref=doc(db,'chats',id);await setDoc(ref,{participants:ids,names:{[user.uid]:user.displayName||'You',[uid]:name},lastMessage:'',updatedAt:serverTimestamp()},{merge:true});openChat(id,uid,name)};
window.interchatOpenChat=(id,uid,name)=>openChat(id,uid,name);
function openChat(id,otherId,name){activeChat=id;if(chatUnsub){chatUnsub();chatUnsub=null}main.innerHTML=`<div class="row between card"><button class="action" onclick="window.interchatBackChats()">← Chats</button><strong>${esc(name)}</strong><button class="action" onclick="window.interchatProfile('${esc(otherId)}')">Profile</button></div><div id="chatMessages" class="card chatmessages"></div><form id="messageForm" class="composer"><input class="input" id="messageInput" placeholder="Message…" maxlength="4000" required><button class="btn">Send</button></form>`;const q=query(collection(db,'chats',id,'messages'),orderBy('createdAt','asc'),limit(200));chatUnsub=onSnapshot(q,s=>{const box=$('#chatMessages');box.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.senderId===user.uid?'mine':''}">${esc(m.text)}<div class="small muted">${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</div></div>`}).join('');box.scrollTop=box.scrollHeight},e=>$('#chatMessages').textContent=e.message);$('#messageForm').onsubmit=async e=>{e.preventDefault();const text=$('#messageInput').value.trim();if(!text)return;$('#messageInput').value='';try{await addDoc(collection(db,'chats',id,'messages'),{senderId:user.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,'chats',id),{lastMessage:text,updatedAt:serverTimestamp()})}catch(err){alert(err.message)}}}
window.interchatBackChats=()=>setPage('chat');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#quickCreate').onclick=()=>setPage('create');
// Firebase user data and saved IDs are loaded by ensureUser() after authentication.
</script>

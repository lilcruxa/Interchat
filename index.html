<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERCHAT</title>
<style>
:root{--bg:#080a12;--panel:#111522;--panel2:#171c2b;--text:#f5f6ff;--muted:#9ba5bd;--accent:#7c5cff;--accent2:#24c8ff;--border:#252b3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.wrap{max-width:1100px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 18px}.brand{font-weight:900;letter-spacing:1px;font-size:22px}.brand span{color:var(--accent2)}.top button,.btn{background:var(--accent);border-radius:12px;padding:10px 14px;font-weight:700}.auth,.panel,.post,.story,.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}.auth{max-width:420px;margin:8vh auto}.auth h1{margin-top:0}.field{width:100%;padding:12px;margin:7px 0;background:#0b0f1a;color:white;border:1px solid var(--border);border-radius:11px}.tabs,.nav{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.nav button{background:var(--panel2);padding:10px 13px;border-radius:12px;color:var(--muted)}.tabs button.active,.nav button.active{background:var(--accent);color:white}.hidden{display:none!important}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}.side{height:max-content;position:sticky;top:10px}.nav{flex-direction:column}.nav button{text-align:left}.content{min-width:0}.stories{display:flex;gap:10px;overflow:auto;margin-bottom:12px}.story{min-width:95px;text-align:center;padding:12px}.story .circle{width:48px;height:48px;margin:auto auto 6px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:bold}.composer textarea{min-height:80px;resize:vertical}.post{margin:12px 0}.posthead{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6b55ff,#29c5ff);display:grid;place-items:center;font-weight:bold}.muted{color:var(--muted);font-size:13px}.postbody{white-space:pre-wrap;margin:14px 0}.post img,.post video{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#05070c}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px}.actions button{background:transparent;color:var(--muted);padding:7px 10px;border-radius:9px}.actions button:hover{background:var(--panel2);color:white}.profileStats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.profileStats b{display:block;font-size:20px}.notice{padding:12px;border-bottom:1px solid var(--border)}.chatrow{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}.badge{background:#ff4b75;border-radius:99px;padding:2px 7px;font-size:12px}.modalbg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(520px,100%);max-height:90vh;overflow:auto}.modal textarea{min-height:65px}.small{font-size:12px;color:var(--muted)}.split{display:flex;justify-content:space-between;gap:8px;align-items:center}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{position:static}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.wrap{padding:8px}.top{padding:8px 2px 12px}}
</style>
</head><body>
<div class="wrap">
<header class="top"><div class="brand">INTER<span>CHAT</span></div><button id="quickPost" class="hidden">＋ Create</button></header>
<section id="authView" class="auth"><h1>Welcome to INTERCHAT</h1><p class="muted">Your world. Your people.</p><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="signupTab">Create account</button></div><form id="authForm"><input id="displayName" class="field hidden" placeholder="Your display name"><input id="email" class="field" type="email" placeholder="Email" required><input id="password" class="field" type="password" placeholder="Password" required><button class="btn" style="width:100%" id="authSubmit">Sign in</button></form><p id="authError" class="small"></p></section>
<section id="appView" class="hidden"><div class="layout"><aside class="side panel"><div class="nav" id="nav"><button data-page="home" class="active">⌂ Home</button><button data-page="explore">◎ Explore & Videos</button><button data-page="chat">✉ Chats <span id="unreadBadge"></span></button><button data-page="notifications">♧ Notifications <span id="notifBadge"></span></button><button data-page="profile">◉ Profile</button><button data-page="settings">⚙ Settings</button></div></aside><main class="content" id="main"></main></div></section>
</div><div id="modalRoot"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,query,orderBy,onSnapshot,updateDoc,arrayUnion,arrayRemove,increment,serverTimestamp,where,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDjKlQjHuzQgDIqOHF_0fLJuqfL9701cJc",authDomain:"interchat-c1cfc.firebaseapp.com",projectId:"interchat-c1cfc",storageBucket:"interchat-c1cfc.appspot.com",messagingSenderId:"",appId:""};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let signup=false,currentUser=null,currentProfile=null,page='home',posts=[],people=[],notifications=[],chats=[],unsubscribePosts=null,unsubNotifs=null;
const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setAuthMode(v){signup=v;$('signupTab').classList.toggle('active',v);$('loginTab').classList.toggle('active',!v);$('displayName').classList.toggle('hidden',!v);$('authSubmit').textContent=v?'Create account':'Sign in';$('authError').textContent=''}
$('loginTab').onclick=()=>setAuthMode(false);$('signupTab').onclick=()=>setAuthMode(true);
$('authForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';try{if(signup){const cred=await createUserWithEmailAndPassword(auth,$('email').value,$('password').value);const name=$('displayName').value.trim()||'User';const username=name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,18)||'user';await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,displayName:name,username,bio:'',savedPostIds:[],createdAt:serverTimestamp()});}else await signInWithEmailAndPassword(auth,$('email').value,$('password').value);}catch(err){$('authError').textContent=err.message;}};
onAuthStateChanged(auth,async user=>{currentUser=user;if(user){await loadProfile();$('authView').classList.add('hidden');$('appView').classList.remove('hidden');startStreams();render();}else{$('authView').classList.remove('hidden');$('appView').classList.add('hidden');if(unsubscribePosts)unsubscribePosts();if(unsubNotifs)unsubNotifs();}});
async function loadProfile(){const snap=await getDoc(doc(db,'users',currentUser.uid));currentProfile=snap.exists()?snap.data():{uid:currentUser.uid,displayName:currentUser.email?.split('@')[0]||'User',username:'user',savedPostIds:[]};}
function startStreams(){if(unsubscribePosts)unsubscribePosts();unsubscribePosts=onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(60)),snap=>{posts=snap.docs.map(d=>({id:d.id,...d.data()}));render();});if(unsubNotifs)unsubNotifs();unsubNotifs=onSnapshot(query(collection(db,'notifications'),where('toUid','==',currentUser.uid),orderBy('createdAt','desc'),limit(50)),snap=>{notifications=snap.docs.map(d=>({id:d.id,...d.data()}));renderBadges();});}
function renderBadges(){const unread=notifications.filter(n=>!n.read).length;$('notifBadge').innerHTML=unread?`<span class="badge">${unread}</span>`:'';$('unreadBadge').innerHTML=chats.filter(c=>c.unreadCount).length?`<span class="badge">${chats.reduce((a,c)=>a+(c.unreadCount||0),0)}</span>`:'';}
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render();}};
$('quickPost').onclick=()=>{page='home';render();$('postText')?.focus();};
function render(){if(!currentUser)return;$('quickPost').classList.remove('hidden');$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const m=$('main');if(page==='home')m.innerHTML=homeHTML();else if(page==='explore')m.innerHTML=exploreHTML();else if(page==='chat')m.innerHTML=chatHTML();else if(page==='notifications')m.innerHTML=notificationsHTML();else if(page==='profile')m.innerHTML=profileHTML(currentProfile);else if(page==='settings')m.innerHTML=settingsHTML();bindPage();renderBadges();}
function postCard(p){const liked=(p.likes||[]).includes(currentUser.uid),saved=(currentProfile.savedPostIds||[]).includes(p.id);return `<article class="post"><div class="posthead"><div class="avatar">${esc((p.displayName||'U')[0])}</div><div><b>${esc(p.displayName||'User')}</b><div class="muted">@${esc(p.username||'user')}</div></div><button style="margin-left:auto;background:none;color:var(--muted)" onclick="window.viewUser('${p.userId}')">Profile</button></div><div class="postbody">${esc(p.text||'')}</div>${p.mediaUrl?(/^https?:\/\//i.test(p.mediaUrl)?(p.type==='video'?`<video controls src="${esc(p.mediaUrl)}"></video>`:`<img src="${esc(p.mediaUrl)}" alt="post media">`):''):''}<div class="muted">${(p.likes||[]).length} likes · ${(p.comments||[]).length} comments · ${(p.reposts||[]).length} reposts</div><div class="actions"><button onclick="window.toggleLike('${p.id}')">${liked?'♥':'♡'} Like</button><button onclick="window.openComments('${p.id}')">Comments</button><button onclick="window.repost('${p.id}')">↻ Repost</button><button onclick="window.savePost('${p.id}')">${saved?'✓ Saved':'☆ Save'}</button><button onclick="window.sharePost('${p.id}')">Share</button></div></article>`}
function homeHTML(){return `<div class="stories">${['Your story','Friends','Discover','Campus','World'].map((s,i)=>`<div class="story" onclick="window.storyPrompt()"><div class="circle">${i?'✦':'＋'}</div>${s}</div>`).join('')}</div><section class="panel composer"><b>Create a post</b><textarea id="postText" class="field" placeholder="What's happening? Tag people with @username"></textarea><input id="postMedia" class="field" placeholder="Optional image/video URL"><div class="split"><span class="small">Share a thought or media link</span><button class="btn" onclick="window.createPost('post')">Post</button></div></section>${posts.map(postCard).join('')||'<div class="empty">Your feed is ready. Make the first post!</div>'}`}
function exploreHTML(){const videos=posts.filter(p=>p.type==='video');return `<h2>Explore & Videos</h2><input id="searchPeople" class="field" placeholder="Search people by name or username" oninput="window.searchPeople(this.value)"><div id="searchResults"></div><h3>Trending posts</h3>${posts.map(postCard).join('')}<h3>Videos</h3>${videos.map(postCard).join('')||'<div class="empty">Videos shared by the community appear here.</div>'}<button class="btn" onclick="window.createVideoPrompt()">＋ Share a video</button>`}
function chatHTML(){return `<h2>Chats</h2><p class="muted">Chat list preview. Choose a person to open a conversation.</p><div class="panel"><button class="btn" onclick="window.findChatPeople()">＋ Find people to chat</button><div id="chatPeople"></div></div><div class="empty">Direct messaging needs the chat database rules and conversation setup completed.</div>`}
function notificationsHTML(){return `<h2>Notifications</h2>${notifications.map(n=>`<div class="notice"><b>${esc(n.title||'INTERCHAT')}</b><div>${esc(n.message||'New activity')}</div><small class="muted">${n.read?'Seen':'New'}</small></div>`).join('')||'<div class="empty">You’re all caught up.</div>'}`}
function profileHTML(u){const mine=u.uid===currentUser.uid,ownPosts=posts.filter(p=>p.userId===u.uid),totalLikes=ownPosts.reduce((a,p)=>a+(p.likes||[]).length,0;return `<section class="panel"><div class="posthead"><div class="avatar" style="width:64px;height:64px">${esc((u.displayName||'U')[0])}</div><div><h2>${esc(u.displayName||'User')}</h2><div class="muted">@${esc(u.username||'user')}</div></div></div><p>${esc(u.bio||'No bio yet.')}</p><div class="profileStats"><div><b>${ownPosts.length}</b><span class="muted">Posts</span></div><div><b>${totalLikes}</b><span class="muted">Total post likes</span></div><div><b>${(u.savedPostIds||[]).length}</b><span class="muted">Saved</span></div></div>${mine?`<button class="btn" onclick="window.editProfile()">Edit profile</button>`:''}</section><h3>${mine?'Your posts':'Posts'}</h3>${ownPosts.map(postCard).join('')||'<div class="empty">No posts yet.</div>'}`}
function settingsHTML(){return `<h2>Settings</h2><div class="panel"><button class="btn" onclick="window.editProfile()">Edit profile</button><p><button class="btn" onclick="window.showMyProfile()">View my profile</button></p><p><button class="btn" onclick="window.showSaved()">Saved posts</button></p><p><button class="btn" onclick="window.toggleTheme()">Toggle theme</button></p><p><button class="btn" onclick="window.logout()">Log out</button></p></div>`}
function bindPage(){const formPost=$('postText');if(formPost)formPost.onkeydown=e=>{};}
window.createPost=async type=>{const text=$('postText')?.value.trim()||'',mediaUrl=$('postMedia')?.value.trim()||'';if(!text&&!mediaUrl)return alert('Add text or a media link first.');try{await addDoc(collection(db,'posts'),{userId:currentUser.uid,displayName:currentProfile.displayName,username:currentProfile.username,text,mediaUrl,type,likes:[],comments:[],reposts:[],createdAt:serverTimestamp()});render();}catch(e){alert('Could not post: '+e.message)}};
window.createVideoPrompt=()=>{page='home';render();$('postText').placeholder='Describe your video';$('postMedia').placeholder='Paste video URL';$('postText').focus();};window.storyPrompt=()=>alert('Story sharing will be enabled after media storage is set up.');
window.toggleLike=async id=>{const p=posts.find(x=>x.id===id);if(!p)return;const liked=(p.likes||[]).includes(currentUser.uid);try{await updateDoc(doc(db,'posts',id),{likes:liked?arrayRemove(currentUser.uid):arrayUnion(currentUser.uid)});if(!liked&&p.userId!==currentUser.uid)await addDoc(collection(db,'notifications'),{toUid:p.userId,title:'New like',message:`${currentProfile.displayName} liked your post.`,fromUid:currentUser.uid,createdAt:serverTimestamp(),read:false});}catch(e){alert(e.message)}};
window.savePost=async id=>{const saved=(currentProfile.savedPostIds||[]).includes(id);try{await updateDoc(doc(db,'users',currentUser.uid),{savedPostIds:saved?arrayRemove(id):arrayUnion(id)});currentProfile.savedPostIds=saved?(currentProfile.savedPostIds||[]).filter(x=>x!==id):[...(currentProfile.savedPostIds||[]),id];render();}catch(e){alert(e.message)}};
window.repost=async id=>{const p=posts.find(x=>x.id===id);if(!p)return;try{await addDoc(collection(db,'posts'),{userId:currentUser.uid,displayName:currentProfile.displayName,username:currentProfile.username,text:`Reposted: ${p.text||'shared post'}`,originalPostId:id,type:'post',likes:[],comments:[],reposts:[],createdAt:serverTimestamp()});if(p.userId!==currentUser.uid)await addDoc(collection(db,'notifications'),{toUid:p.userId,title:'Repost',message:`${currentProfile.displayName} reposted your post.`,fromUid:currentUser.uid,createdAt:serverTimestamp(),read:false});}catch(e){alert(e.message)}};
window.sharePost=id=>{const url=location.href+'#post-'+id;if(navigator.share)navigator.share({title:'INTERCHAT post',url}).catch(()=>{});else prompt('Copy this post link',url)};
window.openComments=id=>{const p=posts.find(x=>x.id===id);if(!p)return;const root=$('modalRoot');root.innerHTML=`<div class="modalbg" onclick="if(event.target===this)this.innerHTML=''"><div class="modal"><div class="split"><h3>Comments</h3><button onclick="document.getElementById('modalRoot').innerHTML=''">Close</button></div><div id="commentList">${(p.comments||[]).map(c=>`<p><b>${esc(c.name)}</b> ${esc(c.text)}</p>`).join('')}</div><textarea id="commentText" class="field" placeholder="Write a comment"></textarea><button class="btn" onclick="window.addComment('${id}')">Comment</button></div></div>`};window.addComment=async id=>{const text=$('commentText').value.trim();if(!text)return;const p=posts.find(x=>x.id===id);try{await updateDoc(doc(db,'posts',id),{comments:arrayUnion({uid:currentUser.uid,name:currentProfile.displayName,text,createdAt:Date.now()})});if(p.userId!==currentUser.uid)await addDoc(collection(db,'notifications'),{toUid:p.userId,title:'New comment',message:`${currentProfile.displayName} commented on your post.`,fromUid:currentUser.uid,createdAt:serverTimestamp(),read:false});$('modalRoot').innerHTML='';}catch(e){alert(e.message)}};
window.viewUser=async uid=>{if(uid===currentUser.uid){page='profile';render();return;}try{const s=await getDoc(doc(db,'users',uid));if(s.exists()){page='profile';render();$('main').innerHTML=profileHTML({...s.data(),uid});}}catch(e){alert(e.message)}};
window.searchPeople=async term=>{if(!term.trim()){ $('searchResults').innerHTML='';return;}try{const s=await getDocs(collection(db,'users'));const results=s.docs.map(d=>d.data()).filter(u=>(u.displayName||'').toLowerCase().includes(term.toLowerCase())||(u.username||'').toLowerCase().includes(term.toLowerCase()));$('searchResults').innerHTML=results.map(u=>`<div class="chatrow"><span>${esc(u.displayName)} @${esc(u.username)}</span><button onclick="window.viewUser('${u.uid}')">View</button></div>`).join('');}catch(e){$('searchResults').textContent=e.message}};
window.findChatPeople=async()=>{try{const s=await getDocs(collection(db,'users'));$('chatPeople').innerHTML=s.docs.map(d=>d.data()).filter(u=>u.uid!==currentUser.uid).map(u=>`<div class="chatrow"><span>${esc(u.displayName)} @${esc(u.username)}</span><button onclick="alert('Messaging setup is the next build stage.')">Message</button></div>`).join('')}catch(e){alert(e.message)}};
window.editProfile=()=>{const root=$('modalRoot');root.innerHTML=`<div class="modalbg" onclick="if(event.target===this)this.innerHTML=''"><div class="modal"><h3>Edit profile</h3><input id="editName" class="field" value="${esc(currentProfile.displayName)}" placeholder="Display name"><input id="editUsername" class="field" value="${esc(currentProfile.username)}" placeholder="Username"><textarea id="editBio" class="field" placeholder="Bio">${esc(currentProfile.bio||'')}</textarea><button class="btn" onclick="window.saveProfile()">Save</button><button onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button></div></div>`};window.saveProfile=async()=>{const data={displayName:$('editName').value.trim(),username:$('editUsername').value.trim().replace(/^@/,''),bio:$('editBio').value.trim()};if(!data.displayName||!data.username)return alert('Name and username are required.');try{await updateDoc(doc(db,'users',currentUser.uid),data);currentProfile={...currentProfile,...data};$('modalRoot').innerHTML='';render();}catch(e){alert(e.message)}};
window.showMyProfile=()=>{page='profile';render()};window.showSaved=()=>{const saved=posts.filter(p=>(currentProfile.savedPostIds||[]).includes(p.id));$('main').innerHTML='<h2>Saved posts</h2>'+saved.map(postCard).join('')||'<div class="empty">No saved posts.</div>'};window.logout=()=>signOut(auth);
window.toggleTheme=()=>{document.body.style.background=document.body.style.background==='white'?'var(--bg)':'white';document.body.style.color=document.body.style.color==='black'?'var(--text)':'black';alert('Temporary theme preview toggled.');};
</script></body></html>

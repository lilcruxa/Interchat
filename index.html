// STORIES: public stories expire 24 hours after publication.
function createStoryModal(){
 if(!user)return;
 openModal('Create a story',`<textarea id="storyText" class="input" placeholder="Add a thought or caption (optional)"></textarea>
 <input id="storyMediaUrl" class="input" style="margin-top:9px" placeholder="Photo/video URL (Firebase Storage upload is not enabled yet)">
 <select id="storyType" class="input" style="margin-top:9px"><option value="text">Text story</option><option value="image">Photo story</option><option value="video">Video story</option></select>
 <p class="small">Text stories work now. Photo and video stories need a hosted media URL until Firebase Storage is configured.</p>
 <button class="primary" id="publishStory" style="width:100%;margin-top:10px">Share story</button>`);
 $('publishStory').onclick=publishStory;
}
async function publishStory(){
 const text=$('storyText').value.trim(),mediaUrl=$('storyMediaUrl').value.trim(),type=$('storyType').value;
 if(!text&&!mediaUrl){toast('Add story text or a media URL');return}
 if((type==='image'||type==='video')&&!mediaUrl){toast('Add a media URL for this story');return}
 if(mediaUrl&&!/^https:\/\/\S+/i.test(mediaUrl)){toast('Use a valid HTTPS media URL');return}
 try{
  await addDoc(collection(db,'stories'),{userId:user.uid,userName:user.displayName||'User',text,mediaUrl,type,createdAt:serverTimestamp(),expiresAt:new Date(Date.now()+24*60*60*1000),viewers:[],reactions:{},visibility:'public'});
  closeModal();toast('Story shared for 24 hours');
 }catch(e){toast('Could not share story: '+e.message)}
}
function loadStories(){
 if(storyUnsub)storyUnsub();
 const q=query(collection(db,'stories'),orderBy('createdAt','desc'),limit(150));
 storyUnsub=onSnapshot(q,s=>{
  const now=Date.now();
  storyDocs=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>{
   const expiry=x.expiresAt?.toDate?x.expiresAt.toDate().getTime():new Date(x.expiresAt||0).getTime();
   return expiry>now;
  });
  renderStories();
 },e=>toast('Stories could not load: '+e.message));
}
function renderStories(){
 const host=$('storyItems');if(!host)return;
 const grouped=new Map();
 storyDocs.forEach(st=>{if(!grouped.has(st.userId))grouped.set(st.userId,[]);grouped.get(st.userId).push(st)});
 const groups=[...grouped.entries()].filter(([uid])=>uid!==user.uid);
 const own=grouped.get(user.uid);if(own)groups.unshift([user.uid,own]);
 host.innerHTML=groups.map(([uid,items])=>{
  const latest=items[0],seen=(latest.viewers||[]).includes(user.uid),name=uid===user.uid?'Your story':(latest.userName||'User');
  const avatar=usersCache[uid]?.photoURL||'';
  return `<div class="storybubble ${seen?'seen':''}" onclick="window.interchatOpenStories('${esc(uid)}')"><div class="avatar">${avatar?`<img src="${esc(avatar)}" alt="">`:esc(initials(name))}</div>${esc(name)}</div>`;
 }).join('');
}
window.interchatOpenStories=uid=>{storyQueue=storyDocs.filter(x=>x.userId===uid).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));storyIndex=0;showStoryAtIndex()};
async function showStoryAtIndex(){
 if(storyIndex<0||storyIndex>=storyQueue.length){closeModal();return}
 const st=storyQueue[storyIndex],own=st.userId===user.uid;
 try{if(!own)await updateDoc(doc(db,'stories',st.id),{viewers:arrayUnion(user.uid)})}catch(e){}
 const total=storyQueue.length,media=st.mediaUrl?(/\.(mp4|webm|mov)(\?|$)/i.test(st.mediaUrl)?`<video controls autoplay playsinline src="${esc(st.mediaUrl)}"></video>`:`<img src="${esc(st.mediaUrl)}" alt="Story">`):'';
 const expiry=st.expiresAt?.toDate?st.expiresAt.toDate():new Date(st.expiresAt),timeLeft=Math.max(0,Math.ceil((expiry-Date.now())/3600000));
 openModal('Story',`<div class="storyprogress"><span style="width:${((storyIndex+1)/total)*100}%"></span></div>
 <div class="storymeta"><strong>${esc(st.userName||'User')}</strong><span class="small">${timeLeft}h left</span></div>
 <div class="storyviewer">${media||`<div class="storyviewer-text">${esc(st.text||'')}</div>`}</div>
 ${media&&st.text?`<p class="posttext">${esc(st.text)}</p>`:''}
 <div class="storymeta"><span class="small">${own?`<button class="secondary" onclick="window.interchatStoryViewers('${esc(st.id)}')">${(st.viewers||[]).length} views</button>`:'Story '+(storyIndex+1)+' of '+total}</span>
 <span><button class="secondary" onclick="window.interchatStoryReact('${esc(st.id)}','❤️')">❤️</button> <button class="secondary" onclick="window.interchatStoryReact('${esc(st.id)}','👏')">👏</button> <button class="secondary" onclick="window.interchatStoryReact('${esc(st.id)}','😂')">😂</button></span></div>
 <button class="secondary" style="width:100%;margin:4px 0" onclick="window.interchatStoryComments('${esc(st.id)}')">Read story replies / comments</button>
 ${own?`<button class="secondary danger" style="width:100%" onclick="window.interchatDeleteStory('${esc(st.id)}')">Delete story</button>`:`<div class="storyreply"><input id="storyReplyInput" class="input" placeholder="Reply to story…"><button class="primary" id="sendStoryReply">Send</button></div>`}
 <div class="row between" style="margin-top:12px"><button class="secondary" id="storyPrev" ${storyIndex===0?'disabled':''}>← Previous</button><button class="secondary" id="storyNext">Next →</button></div>`);
 $('storyPrev').onclick=()=>{storyIndex--;showStoryAtIndex()};$('storyNext').onclick=()=>{storyIndex++;showStoryAtIndex()};
 if(!own)$('sendStoryReply').onclick=()=>sendStoryReply(st);
}

window.interchatStoryViewers=async id=>{
 try{
  const snap=await getDoc(doc(db,'stories',id)),ids=snap.data()?.viewers||[];
  if(!ids.length){openModal('Story viewers','<div class="empty">No views yet.</div>');return}
  const people=await Promise.all(ids.map(async uid=>({uid,p:await getUser(uid)})));
  openModal('Story viewers',people.map(({uid,p})=>`<div class="row" style="padding:9px 0"><div class="avatar">${esc(initials(p.displayName))}</div><div><strong>${esc(p.displayName||'User')}</strong><div class="small">@${esc(p.username||'member')}</div></div></div>`).join(''));
 }catch(e){toast('Could not load viewers')}
};
window.interchatStoryComments=async id=>{
 openModal('Story replies / comments','<div id="storyCommentsList" class="commentlist"><div class="empty">Loading…</div></div>');
 try{
  const snap=await getDocs(query(collection(db,'stories',id,'replies'),orderBy('createdAt','asc')));
  $('storyCommentsList').innerHTML=snap.docs.length?snap.docs.map(d=>{const c=d.data();return `<div class="comment"><strong>${esc(c.userName||'User')}</strong><div>${esc(c.text||'')}</div><div class="small">${esc(stamp(c.createdAt))}</div></div>`}).join(''):'<div class="empty">No replies yet.</div>';
 }catch(e){$('storyCommentsList').innerHTML='<div class="empty">Could not load replies.</div>'}
};

window.interchatStoryReact=async(id,emoji)=>{try{await updateDoc(doc(db,'stories',id),{['reactions.'+user.uid]:emoji});toast('Reaction sent')}catch(e){toast('Could not react to story')}};
async function sendStoryReply(st){
 const input=$('storyReplyInput'),text=input.value.trim();if(!text)return;
 try{
  await addDoc(collection(db,'stories',st.id,'replies'),{userId:user.uid,userName:user.displayName||'User',text,createdAt:serverTimestamp()});
  await addDoc(collection(db,'notifications'),{userId:st.userId,text:(user.displayName||'Someone')+' replied to your story: '+text,storyId:st.id,createdAt:serverTimestamp()});
  input.value='';toast('Story reply sent');
 }catch(e){toast('Reply failed: '+e.message)}
}
window.interchatDeleteStory=async id=>{
 try{await deleteDoc(doc(db,'stories',id));storyQueue=storyQueue.filter(x=>x.id!==id);toast('Story deleted');if(storyQueue.length){storyIndex=Math.min(storyIndex,storyQueue.length-1);showStoryAtIndex()}else closeModal()}catch(e){toast('Could not delete story: '+e.message)}
};

function createPostModal(){if(!user)return;openModal('Create a post',`<textarea id="postText" class="input" placeholder="Share something with your community..."></textarea><input id="postMediaUrl" class="input" style="margin-top:9px" placeholder="Optional photo/video URL (media storage not configured)"><select id="postType" class="input" style="margin-top:9px"><option value="post">Post</option><option value="video">Video</option></select><p class="small">Gallery/camera upload needs Firebase Storage setup. URL media and text posts can be saved now.</p><button class="primary" id="publishPost" style="width:100%;margin-top:10px">Publish</button>`);$('publishPost').onclick=publishPost}
async function publishPost(){const text=$('postText').value.trim(),mediaUrl=$('postMediaUrl').value.trim(),type=$('postType').value;if(!text&&!mediaUrl){toast('Add text or a media URL first');return}try{await addDoc(collection(db,'posts'),{userId:user.uid,userName:user.displayName||'User',username:user.displayName||'User',text,mediaUrl,type,likes:[],reposts:[],createdAt:serverTimestamp(),visibility:'public'});closeModal();toast('Post published');}catch(e){toast('Could not publish: '+e.message)}}
function mediaHtml(url){if(!url)return '';const safe=esc(url);const isVideo=/\.(mp4|webm|mov)(\?|$)/i.test(url);return isVideo?`<video class="media" controls playsinline src="${safe}"></video>`:`<img class="media" loading="lazy" src="${safe}" alt="Post media" onerror="this.style.display='none'">`}
function postHtml(p){const liked=(p.likes||[]).includes(user.uid),saved=(usersCache[user.uid]?.savedPostIds||[]).includes(p.id),author=usersCache[p.userId]||{},isOwn=p.userId===user.uid,isFollowing=(usersCache[user.uid]?.following||[]).includes(p.userId);return `<article class="card" data-post="${esc(p.id)}" ondblclick="window.interchatDoubleLike('${esc(p.id)}',event)"><div class="row between"><div class="row" onclick="window.interchatProfile('${esc(p.userId)}')" style="cursor:pointer" title="View profile"><div class="avatar">${esc(initials(p.userName||author.displayName))}</div><div><strong>${esc(p.userName||author.displayName||'User')}</strong><div class="small">${esc(stamp(p.createdAt))}</div></div></div><div class="row">${isOwn?'':`<button class="secondary followbtn" aria-label="${isFollowing?'Unfollow':'Follow'} ${esc(p.userName||'user')}" onclick="window.interchatFollowFromPost('${esc(p.userId)}',event)">${isFollowing?'✓ Following':'+ Follow'}</button>`}<button class="secondary post-menu-btn" aria-label="More post options" title="More options" onclick="window.interchatPostMenu('${esc(p.id)}')">⋯</button></div></div>${p.text?`<div class="posttext">${esc(p.text)}</div>`:''}${p.mediaUrl?mediaHtml(p.mediaUrl):''}<span class="double-like-heart" aria-hidden="true">♥</span><div class="actions"><button class="like-action ${liked?'liked':''}" aria-label="Like post" onclick="window.interchatLike('${esc(p.id)}')"><span class="action-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z" ${liked?"fill=\"currentColor\"":""}></path></svg></span><span>Like · ${p.likes?.length||0}</span></button><button class="comment-action" aria-label="Comment on post" onclick="window.interchatComments('${esc(p.id)}')"><span class="action-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"></path></svg></span><span>Comment · ${p.commentCount||0}</span></button><button class="repost-action" aria-label="Repost" onclick="window.interchatRepost('${esc(p.id)}')"><span class="action-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"></path></svg></span><span>Repost · ${p.reposts?.length||0}</span></button><button class="share-action" aria-label="Share post" onclick="window.interchatShare('${esc(p.id)}')"><span class="action-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5"></path><path d="M5 13v7h14v-7"></path></svg></span><span>Share</span></button><button class="save-action" aria-label="Save post" onclick="window.interchatSave('${esc(p.id)}')"><span class="action-icon">${saved?'<svg class="ui-icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="currentColor"></path></svg>':'<svg class="ui-icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>'}</span><span>${saved?'Saved':'Save'}</span></button></div></article>`}
window.interchatLike=async id=>{const p=feedPosts.find(x=>x.id===id);if(!p)return;const was=(p.likes||[]).includes(user.uid);p.likes=was?(p.likes||[]).filter(x=>x!==user.uid):[...(p.likes||[]),user.uid];renderFeed();try{await updateDoc(doc(db,'posts',id),{likes:was?arrayRemove(user.uid):arrayUnion(user.uid)});}catch(e){p.likes=was?[...(p.likes||[]),user.uid]:(p.likes||[]).filter(x=>x!==user.uid);renderFeed();toast('Like failed')}};window.interchatDoubleLike=async(id,e)=>{if(e?.target?.closest('button,a,input,textarea,select'))return;try{const r=doc(db,'posts',id),snap=await getDoc(r);if(!snap.exists())return;const likes=snap.data().likes||[];if(!likes.includes(user.uid)){await updateDoc(r,{likes:arrayUnion(user.uid)});}const card=document.querySelector(`[data-post=\"${CSS.escape(id)}\"]`);const heart=card?.querySelector('.double-like-heart');if(heart){heart.classList.remove('pop');void heart.offsetWidth;heart.classList.add('pop')}}catch(err){toast('Could not like post')}};window.interchatComments=id=>commentsModal(id);window.interchatRepost=async id=>{const p=feedPosts.find(x=>x.id===id);if(!p)return;const was=(p.reposts||[]).includes(user.uid);p.reposts=was?(p.reposts||[]).filter(x=>x!==user.uid):[...(p.reposts||[]),user.uid];renderFeed();try{await updateDoc(doc(db,'posts',id),{reposts:was?arrayRemove(user.uid):arrayUnion(user.uid)});toast(was?'Repost removed':'Reposted')}catch(e){p.reposts=was?[...(p.reposts||[]),user.uid]:(p.reposts||[]).filter(x=>x!==user.uid);renderFeed();toast('Repost failed')}};window.interchatSave=async id=>{const ref=doc(db,'users',user.uid),snap=await getDoc(ref),arr=snap.data()?.savedPostIds||[];await updateDoc(ref,{savedPostIds:arr.includes(id)?arrayRemove(id):arrayUnion(id)});usersCache[user.uid].savedPostIds=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];toast(arr.includes(id)?'Removed from saved':'Saved')};window.interchatShare=async id=>{const url=location.href.split('#')[0]+'#post-'+id;if(navigator.share){try{await navigator.share({title:'INTERCHAT post',url})}catch{}}else{await navigator.clipboard?.writeText(url);toast('Post link copied')}};window.interchatPostMenu=id=>{const p=feedPosts.find(x=>x.id===id),own=p?.userId===user.uid;openModal('Post options',`${own?`<button class="secondary settingsitem" onclick="window.interchatDeletePost('${esc(id)}')">🗑 Delete post</button>`:''}<button class="secondary settingsitem" onclick="window.interchatReport('${esc(id)}')">🚩 Report post</button><button class="secondary settingsitem" onclick="window.interchatHide('${esc(id)}')">🙈 Hide post</button>`)};window.interchatDeletePost=async id=>{const p=feedPosts.find(x=>x.id===id);if(!p||p.userId!==user.uid)return toast('You can only delete your own post');if(!confirm('Delete this post permanently?'))return;const index=feedPosts.findIndex(x=>x.id===id);feedPosts=feedPosts.filter(x=>x.id!==id);renderFeed();closeModal();try{await deleteDoc(doc(db,'posts',id));toast('Post deleted')}catch(e){if(index>=0)feedPosts.splice(Math.min(index,feedPosts.length),0,p);renderFeed();toast('Could not delete post')}};window.interchatReport=async id=>{const reason=prompt('Report reason: Spam, Harassment, Fake account, Violence, or Other');if(!reason)return;try{await addDoc(collection(db,'reports'),{reporterId:user.uid,postId:id,reason:reason.trim(),createdAt:serverTimestamp(),status:'open'});closeModal();toast('Report submitted')}catch(e){toast('Report failed')}};window.interchatHide=async id=>{const oldHidden=[...(usersCache[user.uid]?.hiddenPostIds||[])],oldFeed=[...feedPosts];usersCache[user.uid]={...(usersCache[user.uid]||{}),hiddenPostIds:[...new Set([...oldHidden,id])]};feedPosts=feedPosts.filter(p=>p.id!==id);renderFeed();closeModal();try{await updateDoc(doc(db,'users',user.uid),{hiddenPostIds:arrayUnion(id)});toast('Post hidden')}catch(e){usersCache[user.uid].hiddenPostIds=oldHidden;feedPosts=oldFeed;renderFeed();toast('Could not hide post')}};window.interchatProfile=id=>{if(activeSection!=='profile'){sectionScroll[activeSection]=$('main').scrollTop;navHistory.push({section:activeSection,profile:currentProfile,scroll:sectionScroll[activeSection]||0});history.pushState({interchat:true},'',`#profile-${id}`)}currentProfile=id;activeSection='profile';document.querySelectorAll('.section').forEach(section=>section.classList.remove('active'));$('profile').classList.add('active');document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.section==='profile'));renderProfile(id);$('main').scrollTop=0;updateBackButton()};
function loadFeed(){if(feedUnsub)feedUnsub();const q=query(collection(db,'posts'),orderBy('createdAt','desc'),limit(100));feedUnsub=onSnapshot(q,s=>{const hidden=(usersCache[user.uid]?.hiddenPostIds||[]);const blocked=(usersCache[user.uid]?.blockedUsers||[]);feedPosts=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>!hidden.includes(p.id)&&!blocked.includes(p.userId));renderFeed();},e=>toast('Feed error: '+e.message))};function renderFeed(){const f=$('feed');if(!f)return;f.innerHTML=feedPosts.length?feedPosts.map(postHtml).join(''):`<div class="empty">Nothing here yet. Start the conversation by creating a post.</div>`;if(activeSection==='discover')renderDiscover()}

async function commentsModal(postId){openModal('Comments',`<div class="commentlist" id="commentList"><div class="empty">Loading comments…</div></div><div class="commentform"><input id="commentInput" class="input" placeholder="Write a comment…"><button class="primary" id="sendComment">Send</button></div>`);const q=query(collection(db,'posts',postId,'comments'),orderBy('createdAt','asc'));commentsUnsub=onSnapshot(q,s=>{$('commentList').innerHTML=s.docs.length?s.docs.map(d=>{const c=d.data();return `<div class="comment"><strong>${esc(c.userName||'User')}</strong><div>${esc(c.text||'')}</div><div class="small">${esc(stamp(c.createdAt))}</div></div>`}).join(''):`<div class="empty">Be the first to comment.</div>`},e=>toast('Comments error'));$('sendComment').onclick=async()=>{const text=$('commentInput').value.trim();if(!text)return;try{await addDoc(collection(db,'posts',postId,'comments'),{userId:user.uid,userName:user.displayName||'User',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',postId),{commentCount:increment(1)});$('commentInput').value=''}catch(e){toast('Comment failed: '+e.message)}};$('commentInput').onkeydown=e=>{if(e.key==='Enter')$('sendComment').click()}}
async function getUser(uid){if(usersCache[uid])return usersCache[uid];const s=await getDoc(doc(db,'users',uid));usersCache[uid]=s.exists()?s.data():{uid,displayName:'User'};return usersCache[uid]}
async function renderProfile(uid){currentProfile=uid;const p=await getUser(uid),own=uid===user.uid,posts=feedPosts.filter(x=>x.userId===uid);if(!own&&((usersCache[user.uid]?.blockedUsers||[]).includes(uid)||(p.blockedUsers||[]).includes(user.uid))){$('profileContent').innerHTML='<div class="card empty">This profile is unavailable because a block is active.</div>';return}if(!own){const q=query(collection(db,'posts'),where('userId','==',uid),orderBy('createdAt','desc'),limit(80));const s=await getDocs(q);posts.splice(0,posts.length,...s.docs.map(d=>({id:d.id,...d.data()})))}const mediaPosts=posts.filter(x=>x.mediaUrl),followers=p.followers||[],following=p.following||[],isFollowing=(usersCache[user.uid]?.following||[]).includes(uid);$('profileContent').innerHTML=`<div class="backline"><button class="secondary" onclick="window.interchatBack()" aria-label="Back">← Back</button><strong>${own?'Your profile':'Profile'}</strong></div><div class="card profilehead"><div class="avatar" style="width:76px;height:76px;margin:auto;font-size:24px">${esc(initials(p.displayName))}</div><h2>${esc(p.displayName||'User')}</h2><div class="small">@${esc(p.username||'member')}</div><p>${esc(p.bio||'')}</p><div class="stats"><div class="stat"><strong>${mediaPosts.length}</strong><span class="small">Posts</span></div><button class="stat profile-stat-btn" onclick="window.interchatShowConnections('${esc(uid)}','followers')"><strong>${followers.length}</strong><span class="small">Followers</span></button><button class="stat profile-stat-btn" onclick="window.interchatShowConnections('${esc(uid)}','following')"><strong>${following.length}</strong><span class="small">Following</span></button><div class="stat"><strong>${posts.reduce((n,x)=>n+(x.likes?.length||0),0)}</strong><span class="small">Likes</span></div></div>${own?`<button class="secondary" id="editProfileBtn2">Edit profile</button><button class="secondary" id="settingsOpen">Settings</button>`:`<div class="row" style="justify-content:center"><button class="primary followbtn" id="followBtn">${isFollowing?'Following':'Follow'}</button><button class="secondary" id="messageUser">Message</button><button class="secondary" id="blockUser">Block</button></div>`}</div><div class="card"><h3>Posts</h3><div class="gridposts">${mediaPosts.map(x=>`<div class="tile" onclick="window.interchatOpenPost('${esc(x.id)}')">${/\.(mp4|webm|mov)/i.test(x.mediaUrl)?`<video src="${esc(x.mediaUrl)}"></video>`:`<img src="${esc(x.mediaUrl)}">`}</div>`).join('')||'<div class="small">No photo or video posts yet.</div>'}</div></div>`;if(own){$('editProfileBtn2').onclick=editProfile;$('settingsOpen').onclick=()=>go('settings')}else{$('followBtn').onclick=()=>followUser(uid);$('messageUser').onclick=()=>startChat(uid,p);$('blockUser').onclick=()=>blockUser(uid)}}
window.interchatShowConnections=async(uid,kind)=>{try{const profile=await getUser(uid),ids=profile[kind]||[];const title=kind==='followers'?'Followers':'Following';if(!ids.length){openModal(title,'<div class=\"empty\">No '+title.toLowerCase()+' yet.</div>');return}const people=await Promise.all(ids.map(async id=>({id,p:await getUser(id)})));openModal(title,people.map(({id,p})=>`<button class=\"row settingsitem\" style=\"display:flex;align-items:center;gap:12px;background:transparent;color:inherit;padding:10px;width:100%\" onclick=\"window.interchatOpenConnection('${esc(id)}')\"><span class=\"avatar\">${esc(initials(p.displayName))}</span><span style=\"text-align:left\"><strong>${esc(p.displayName||'User')}</strong><span class=\"small\" style=\"display:block\">@${esc(p.username||'member')}</span></span></button>`).join(''))}catch(e){toast('Could not load '+kind)}};window.interchatOpenConnection=id=>{closeModal();window.interchatProfile(id)};window.interchatOpenPost=async id=>{let p=feedPosts.find(x=>x.id===id);if(!p){try{const snap=await getDoc(doc(db,'posts',id));if(snap.exists())p={id:snap.id,...snap.data()}}catch(e){toast('Could not open post')} }if(p)openModal('Post',postHtml(p))};async function editProfile(){const p=await getUser(user.uid);openModal('Edit profile',`<input class="input" id="editDisplay" value="${esc(p.displayName||'')}" placeholder="Display name"><input class="input" id="editUsername" style="margin-top:8px" value="${esc(p.username||'')}" placeholder="Username"><textarea class="input" id="editBio" style="margin-top:8px" placeholder="Bio">${esc(p.bio||'')}</textarea><button class="primary" id="saveProfile" style="width:100%;margin-top:10px">Save</button>`);$('saveProfile').onclick=async()=>{const displayName=$('editDisplay').value.trim(),username=$('editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),bio=$('editBio').value.trim();if(!displayName||!username){toast('Name and username required');return}await updateDoc(doc(db,'users',user.uid),{displayName,username,bio});usersCache[user.uid]={...p,displayName,username,bio};await updateProfile(user,{displayName});closeModal();renderProfile(user.uid)}}
async function followUser(uid){const ref=doc(db,'users',user.uid),snap=await getDoc(ref),arr=snap.data()?.following||[],follow=arr.includes(uid);await updateDoc(ref,{following:follow?arrayRemove(uid):arrayUnion(uid)});const target=doc(db,'users',uid),ts=await getDoc(target);if(ts.exists())await updateDoc(target,{followers:follow?arrayRemove(user.uid):arrayUnion(user.uid)});usersCache[user.uid]={...(usersCache[user.uid]||snap.data()||{}),following:follow?arr.filter(x=>x!==uid):[...arr,uid]};if(usersCache[uid])usersCache[uid]={...usersCache[uid],followers:follow?(usersCache[uid].followers||[]).filter(x=>x!==user.uid):[...(usersCache[uid].followers||[]),user.uid]};toast(follow?'Unfollowed':'Following');if(activeSection==='profile')renderProfile(uid);else renderFeed()}window.interchatFollowFromPost=async(uid,e)=>{e?.stopPropagation();try{await followUser(uid)}catch(err){toast('Follow failed: '+err.message)}};
async function blockUser(uid){const ref=doc(db,'users',user.uid);await updateDoc(ref,{blockedUsers:arrayUnion(uid)});usersCache[user.uid].blockedUsers=[...(usersCache[user.uid].blockedUsers||[]),uid];closeModal();toast('User blocked');go('profile')}
function renderDiscover(){const term=$('discoverSearch').value.trim().toLowerCase();if(discoverMode==='people'){renderPeople(term);return}const blocked=(usersCache[user.uid]?.blockedUsers||[]);let list=feedPosts.filter(p=>!blocked.includes(p.userId)&&(discoverMode==='video'?p.type==='video'||/\.(mp4|webm|mov)/i.test(p.mediaUrl||''):true));if(term)list=list.filter(p=>(p.text||'').toLowerCase().includes(term)||(p.userName||'').toLowerCase().includes(term));$('discoverContent').innerHTML=list.length?list.map(postHtml).join(''):`<div class="empty">No content found.</div>`}document.querySelectorAll('[data-discover]').forEach(b=>b.onclick=()=>{discoverMode=b.dataset.discover;renderDiscover()});$('discoverSearch').oninput=()=>renderDiscover();async function renderPeople(term){const s=await getDocs(query(collection(db,'users'),limit(60)));const people=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==user.uid&&!(usersCache[user.uid]?.blockedUsers||[]).includes(p.id)&&(!term||(p.displayName||'').toLowerCase().includes(term)||(p.username||'').toLowerCase().includes(term)));$('discoverContent').innerHTML=people.length?people.map(p=>`<div class="card row between"><button class="row" style="background:transparent;color:inherit;text-align:left;flex:1" onclick="window.interchatProfile('${esc(p.id)}')"><div class="avatar">${esc(initials(p.displayName))}</div><div><strong>${esc(p.displayName||'User')}</strong><div class="small">@${esc(p.username||'member')}</div></div></button><button class="secondary" onclick="window.interchatProfile('${esc(p.id)}')">View</button></div>`).join(''):`<div class="empty">No people found.</div>`}
async function startChat(uid,p){
 if(!uid||uid===user.uid)return;const myBlocked=usersCache[user.uid]?.blockedUsers||[];if(myBlocked.includes(uid)||(p?.blockedUsers||[]).includes(user.uid)){toast('Messaging is unavailable for this connection');return}const cid=chatId(user.uid,uid);
 try{await setDoc(doc(db,'chats',cid),{type:'direct',members:[user.uid,uid],createdAt:serverTimestamp(),lastMessage:'',lastAt:serverTimestamp()},{merge:true});}catch(e){toast('Could not open conversation: '+e.message);return}

}
function chatId(a,b){return[a,b].sort().join('_')}
async function loadChatList(){if(!user)return;if(chatUnsub){chatUnsub();chatUnsub=null}$('chatRoom').classList.remove('show');$('chatList').classList.remove('hidden');const host=$('chatListItems');host.innerHTML='<div class="empty">Loading conversations…</div>';try{const snap=await getDocs(query(collection(db,'chats'),where('members','array-contains',user.uid),limit(80)));const items=[];for(const d of snap.docs){const c=d.data();if(c.type==='group'){items.push({id:d.id,type:'group',title:c.title||'Group chat',photoURL:c.photoURL||'',members:c.members||[],last:c.lastMessage||'',lastAt:c.lastAt||null});}else{const other=(c.members||[]).find(x=>x!==user.uid);if(!other)continue;const p=await getUser(other);items.push({id:d.id,type:'direct',other,p,last:c.lastMessage||'',lastAt:c.lastAt||null});}}items.sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));host.innerHTML=items.length?items.map(x=>x.type==='group'?`<div class="card row" onclick="window.interchatOpenGroup('${esc(x.id)}')"><div class="avatar group-avatar">${x.photoURL?`<img src="${esc(x.photoURL)}" alt="">`:'👥'}</div><div style="flex:1;min-width:0"><strong>${esc(x.title)}</strong><div class="small">${x.members.length} members · ${esc(x.last)}</div></div><span class="small">Group</span></div>`:`<div class="card row" onclick="window.interchatStartChat('${esc(x.other)}')"><div class="avatar">${esc(initials(x.p.displayName))}</div><div style="flex:1;min-width:0"><strong>${esc(x.p.displayName||'User')}</strong><div class="small">${esc(x.last)}</div></div></div>`).join(''):'<div class="empty">Your conversations will appear here. Open a profile and tap Message, or create a group.</div>';}catch(e){host.innerHTML='<div class="empty">Could not load chats: '+esc(e.message)+'</div>';}}
window.interchatStartChat=async uid=>startChat(uid,await getUser(uid));
$('backChats').onclick=()=>navigateBack();
let pendingChatMessages=[];async function loadMessages(chat){if(chatUnsub)chatUnsub();pendingChatMessages=[];const q=query(collection(db,'chats',chat.id,'messages'),orderBy('createdAt','asc'),limit(150));chatUnsub=onSnapshot(q,s=>{const host=$('messages');if(!host)return;host.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.senderId===user.uid?'mine':''}">${esc(m.text)}<div class="small">${esc(stamp(m.createdAt))}</div></div>`}).join('')+pendingChatMessages.map(m=>`<div class="bubble mine" data-pending-id="${esc(m.id)}">${esc(m.text)}<div class="small">${m.failed?'Not sent · ': 'Sending…'}${m.failed?`<button class="retry-send" onclick="window.interchatRetryMessage(this)">Retry</button>`:''}</div></div>`).join('');host.scrollTop=host.scrollHeight},e=>toast('Chat load error: '+e.message))}
let messageSending=false;async function sendMessage(){const input=$('chatInput'),text=input.value.trim();if(!text||!currentChat)return;const chat=currentChat,cid=chat.id;input.value='';const pending={id:'pending-'+Date.now()+'-'+Math.random().toString(36).slice(2),text,failed:false,chatId:cid,chat};pendingChatMessages.push(pending);const host=$('messages');if(host){host.innerHTML+=`<div class="bubble mine" data-pending-id="${esc(pending.id)}">${esc(text)}<div class="small">Sending…</div></div>`;host.scrollTop=host.scrollHeight;}try{const messageRef=doc(collection(db,'chats',cid,'messages'));await Promise.all([setDoc(doc(db,'chats',cid),{members:chat.type==='group'?chat.members:[user.uid,chat.uid],type:chat.type||'direct',lastMessage:text,lastAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true}),setDoc(messageRef,{senderId:user.uid,senderName:user.displayName||'User',text,createdAt:serverTimestamp()})]);pendingChatMessages=pendingChatMessages.filter(m=>m.id!==pending.id);}catch(e){pending.failed=true;toast('Message not sent. Tap Retry to try again.')}if(currentChat?.id===cid){const host2=$('messages');if(host2){host2.innerHTML+=pendingChatMessages.filter(m=>m.chatId===cid).map(m=>`<div class="bubble mine" data-pending-id="${esc(m.id)}">${esc(m.text)}<div class="small">${m.failed?'Not sent · ': 'Sending…'}${m.failed?`<button class="retry-send" onclick="window.interchatRetryMessage(this)">Retry</button>`:''}</div></div>`).join('');host2.scrollTop=host2.scrollHeight;}}
window.interchatRetryMessage=btn=>{const bubble=btn.closest('.bubble'),id=bubble?.dataset.pendingId,pending=pendingChatMessages.find(m=>m.id===id);if(!pending)return;pending.failed=false;pendingChatMessages=pendingChatMessages.filter(m=>m.id!==id);if(currentChat?.id===pending.chatId){const input=$('chatInput');input.value=pending.text;sendMessage()}};$('sendChat').onclick=sendMessage;$('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};

async function createGroupModal(){try{const snap=await getDocs(query(collection(db,'users'),limit(100)));const people=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==user.uid);openModal('Create a group',`<input class="input" id="groupName" placeholder="Group name"><input class="input" id="groupPhoto" style="margin-top:8px" placeholder="Optional group photo HTTPS URL"><input class="input" id="groupMemberSearch" style="margin-top:8px" placeholder="Find members by name or username"><div id="groupMemberList" style="max-height:38vh;overflow:auto;margin-top:8px">${people.map(p=>`<label class="row" style="padding:8px;border-bottom:1px solid var(--line)"><input type="checkbox" class="group-member-check" value="${esc(p.id)}"><span class="avatar">${esc(initials(p.displayName))}</span><span><strong>${esc(p.displayName||'User')}</strong><span class="small" style="display:block">@${esc(p.username||'member')}</span></span></label>`).join('')}</div><button class="primary" id="makeGroupBtn" style="width:100%;margin-top:12px">Create group</button>`);$('groupMemberSearch').oninput=()=>{const term=$('groupMemberSearch').value.toLowerCase();$('groupMemberList').querySelectorAll('label').forEach(el=>el.classList.toggle('hidden',!el.textContent.toLowerCase().includes(term)))};$('makeGroupBtn').onclick=async()=>{const title=$('groupName').value.trim(),photoURL=$('groupPhoto').value.trim(),selected=[...document.querySelectorAll('.group-member-check:checked')].map(x=>x.value);if(!title){toast('Enter a group name');return}if(!selected.length){toast('Select at least one member');return}if(photoURL&&!/^https:\/\/\S+/i.test(photoURL)){toast('Group photo must be an HTTPS URL');return}const members=[user.uid,...selected];try{const ref=await addDoc(collection(db,'chats'),{type:'group',title,photoURL,members,admins:[user.uid],createdBy:user.uid,createdAt:serverTimestamp(),lastMessage:'Group created',lastAt:serverTimestamp()});closeModal();await openGroup(ref.id);toast('Group created')}ca async function openGroup(id){const snap=await getDoc(doc(db,'chats',id));if(!snap.exists()){toast('Group not found');return}const c=snap.data();if(!(c.members||[]).includes(user.uid)){toast('You are not a member of this group');return}const addChatHistory=!currentChat;currentChat={id,type:'group',title:c.title||'Group chat',members:c.members||[],admins:c.admins||[],photoURL:c.photoURL||''};go('chat');if(addChatHistory){navHistory.push({section:'chat',profile:currentProfile,scroll:sectionScroll.chat||0,chat:null});history.pushState({interchatChat:true},'',`#chat-${id}`)}$('chatList').classList.add('hidden');$('chatRoom').classList.add('show');$('chatTitle').textContent=currentChat.title;$('chatSubtitle').textContent=(c.members||[]).length+' members';$('chatUserProfile').textContent='Members';$('chatUserProfile').onclick=()=>showGroupMembers(id);loadMessages(currentChat)}
window.interchatOpenGroup=openGroup;
async function showGroupMembers(id){const s=await getDoc(doc(db,'chats',id)),c=s.data()||{},isAdmin=(c.admins||[]).includes(user.uid),members=await Promise.all((c.members||[]).map(async uid=>({uid,p:await getUser(uid)})));openModal('Group members',members.map(x=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><button class="row" style="background:transparent;color:inherit;text-align:left;flex:1" onclick="window.interchatOpenConnection('${esc(x.uid)}')"><span class="avatar">${esc(initials(x.p.displayName))}</span><span>${esc(x.p.displayName||'User')}<span class="small" style="display:block">${(c.admins||[]).includes(x.uid)?'Admin':'Member'}</span></span></button>${isAdmin&&x.uid!==user.uid?`<button class="secondary danger" onclick="window.interchatRemoveGroupMember('${esc(id)}','${esc(x.uid)}')">Remove</button>`:''}</div>`).join('')+(isAdmin?`<button class="primary" id="addGroupMembers" style="width:100%;margin-top:10px">＋ Add members</button>`:'')+`<button class="secondary danger" onclick="window.interchatLeaveGroup('${esc(id)}')" style="width:100%;margin-top:10px">Leave group</button>`);if($('addGroupMembers'))$('addGroupMembers').onclick=()=>addGroupMembers(id,c)}
window.interchatRemoveGroupMember=async(id,uid)=>{try{await updateDoc(doc(db,'chats',id),{members:arrayRemove(uid)});toast('Member removed');if(currentChat?.id===id)currentChat.members=currentChat.members.filter(x=>x!==uid);showGroupMembers(id)}catch(e){toast('Could not remove member: '+e.message)}};

async function addGroupMembers(id,c){const s=await getDocs(query(collection(db,'users'),limit(100))),people=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==user.uid&&!(c.members||[]).includes(p.id));openModal('Add group members',people.map(p=>`<label class="row" style="padding:8px"><input type="checkbox" class="add-group-check" value="${esc(p.id)}"><span>${esc(p.displayName||'User')} <span class="small">@${esc(p.username||'member')}</span></span></label>`).join('')+'<button class="primary" id="confirmAddMembers" style="width:100%;margin-top:10px">Add selected</button>');$('confirmAddMembers').onclick=async()=>{const ids=[...document.querySelectorAll('.add-group-check:checked')].map(x=>x.value);if(!ids.length)return toast('Select members first');try{await updateDoc(doc(db,'chats',id),{members:arrayUnion(...ids)});closeModal();toast('Members added');showGroupMembers(id)}catch(e){toast('Could not add members: '+e.message)}}}
function loadUnreadChatBadge(){// Badge will show a simple count of chat documents; exact unread tracking needs message read-state.
getDocs(query(collection(db,'chats'),where('members','array-contains',user.uid),limit(50))).then(s=>{const n=s.size;if(n){$('chatBadge').textContent=n;$('chatBadge').classList.remove('hidden')}})}

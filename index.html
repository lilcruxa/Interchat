<!DOCTYPE html>
<html lang="en">
<head>

<title>INTERCHAT</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:30px}.top{position:sticky;top:0;z-index:15;background:rgba(8,10,18,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 14px 9px}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:1.2px;font-size:20px}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:19px;position:relative}.nav{display:flex;justify-content:space-around;margin-top:10px}.nav button{width:23%;height:44px;border-radius:13px;background:transparent;font-size:21px;color:var(--muted)}.nav button.active{background:#202b4a;color:#a9b7ff}.badge{position:absolute;top:3px;right:3px;background:#ff5478;color:#fff;border-radius:20px;min-width:16px;height:16px;font-size:10px;display:grid;place-items:center;padding:0 3px}.main{padding:12px}.section{display:none}.section.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7588ff,#b76cff);display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.pill{padding:8px 12px;border-radius:999px;background:var(--panel2);font-size:13px}.primary{background:var(--accent);color:white;border-radius:12px;padding:10px 14px;font-weight:700}.secondary{background:var(--panel2);border-radius:1 t:40vh;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;background:var(--panel2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{background:#344577;align-self:flex-end}.settingsitem{width:100%;text-align:left;margin:5px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:#252d43;border:1px solid var(--line);padding:11px 16px;border-radius:12px;display:none;max-width:90%}.toast.show{display:block}.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(440px,100%)}.hidden{display:none!important}.discoverfilter{display:flex;gap:7px;overflow:auto}.discoverfilter button{white-space:nowrap}.storyrow{display:flex;gap:12px;overflow:auto;padding:3px 0 12px}.storybubble{min-width:66px;text-align:center;font-size:12px;color:var(--muted)}.storybubble .avatar{margin:0 auto 5px;border:2px solid var(--accent)}.notice{border:1px solid #594d8d;background:#1a1730;border-radius:12px;padding:10px;color:#d5d0ff;font-size:13px;margin-bottom:12px}.videofeed .videoitem{position:relative;background:#000;border-radius:18px;overflow:hidden;min-height:62vh;margin-bottom:12px}.videoitem video{width:100%;height:62vh;object-fit:contain}.videooverlay{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;text-shadow:0 2px 4px #000}.videooverlay button{background:#202433cc;border-radius:12px;padding:10px}.followbtn{min-width:94px}.footerhint{font-size:12px;color:var(--muted);text-align:center;padding:12px}
@media(min-width:700px){.main{padding:16px}.top{padding-left:18px;padding-right:18px}}
</style>

<body>
<div id="auth" class="auth"><div class="authbox card"><div class="brand" style="font-size:28px">INTERCHAT</div><p class="muted">Your world. Your people.</p><div class="tabs"><button class="secondary" id="signinTab">Sign in</button><button class="secondary" id="signupTab">Create account</button></div><input class="input" id="authName" placeholder="Display name" autocomplete="name"><input class="input" id="authEmail" placeholder="Email" autocomplete="email" type="email" style="margin-top:9px"><input class="input" id="authPass" placeholder="Password" autocomplete="current-password" type="password" style="margin-top:9px"><button class="primary" id="authSubmit" style="width:100%;margin-top:12px">Sign in</button><p class="small" id="authMsg"></p></div></div>
<div id="app" class="app hidden">
<header class="top"><div class="toprow"><div class="brand">INTERCHAT</div><div class="top-actions"><button class="iconbtn" id="searchBtn" title="Search">⌕</button><button class="iconbtn" id="notifBtn" title="Notifications">♧<span class="badge hidden" id="notifBadge">0</span></button><button class="iconbtn" id="createBtn" title="Create">＋</button></div></div><nav class="nav"><button data-section="home" class="active" title="Home">⌂</button><button data-section="discover" title="Discover">◉</button><button data-section="chat" title="Chat">▣<span class="badge hidden" id="chatBadge">0</span></button><button data-section="profile" title="Profile">♙</button></nav></header>
<main class="main">
<section id="home" class="section active"><div class="storyrow" id="storyRow"><div class="storybubble" id="addStory"><div class="avatar">＋</div>Your story</div></div><div class="card"><div class="row"><div class="avatar" id="homeAvatar">I</div><button class="secondary" style="flex:1;text-align:left" id="quickCompose">What's on your mind?</button></div></div><div id="feed"></div></section>
<section id="discover" class="section"><div class="card"><h3 style="margin:0 0 8px">Discover</h3><input class="input" id="discoverSearch" placeholder="Search people or posts"></div><div class="tabs discoverfilter"><button class="pill" data-discover="all">For you</button><button class="pill" data-discover="video">Videos</button><button class="pill" data-discover="people">People</button></div><div id="discoverContent"></div></section>
<section id="chat" class="section"><div id="chatList" class="chatlist"></div><div id="chatRoom" class="chatroom"><div class="card row between"><button class="secondary" id="backChats">←</button><strong id="chatTitle">Chat</strong><button class="secondary" id="chatUserProfile">Profile</button></div><div class="messages" id="messages"></div><div class="commentform"><input class="input" id="chatInput" placeholder="Message"><button class="primary" id="sendChat">Send</button></div></div></section>
<section id="profile" class="section"><div id="profileContent"></div></section>
<section id="notifications" class="section"><div class="card"><h3>Notifications</h3><div id="notificationList"></div></div></section>
<section id="settings" class="section"><div class="card"><h3>Settings</h3><button class="secondary settingsitem" id="editProfileBtn">✎ Edit profile</button><button class="secondary settingsitem" id="myProfileBtn">♙ View my profile</button><button class="secondary settingsitem" id="savedBtn">▣ Saved posts</button><button class="secondary settingsitem" id="themeBtn">☼ Toggle theme</button><button class="secondary settingsitem" id="privacyBtn">♧ Privacy & safety</button><button class="secondary settingsitem danger" id="logoutBtn">↪ Sign out</button></div><div class="card"><h4>Privacy & safety</h4><p class="small">Use blocking or reporting if you encounter unwanted content. Avoid sharing sensitive personal information in public posts or chats.</p><button class="secondary" id="blockedBtn">View blocked users</button></div></section>
</main></div>
<div id="modalWrap" class="modalwrap"><div class="modal" id="modal"><div class="modalhead"><strong id="modalTitle">INTERCHAT</strong><button class="secondary" id="modalClose">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, getDocs, onSnapshot, serverTimestamp, increment, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// Replace apiKey with the Web API key from Firebase Project settings if your project key has changed.
const firebaseConfig={apiKey:'AIzaSyDjKlQjHuzQgDIqOHF_0fLJuqfL9701cJc',authDomain:'interchat-c1cfc.firebaseapp.com',projectId:'interchat-c1cfc',storageBucket:'interchat-c1cfc.firebasestorage.app',messagingSenderId:'583165274280',appId:'1:583165274280:web:cab44e35230adc157a7a9d'};
const appFirebase=initializeApp(firebaseConfig),auth=getAuth(appFirebase),db=getFirestore(appFirebase);
const $=id=>document.getElementById(id);let user=null,signup=false,activeSection='home',feedPosts=[],usersCache={},currentProfile=null,currentChat=null,chatUnsub=null,feedUnsub=null,notifUnsub=null,commentsUnsub=null,chatUnsubs=[],savedMode=false,discoverMode='all',themeLight=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const usernameFor=u=>u?.username||u?.displayName||'User';const initials=s=>String(s||'I').trim().slice(0,1).toUpperCase();const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};const stamp=d=>{if(!d)return 'Just now';const dt=d.toDate?d.toDate():new Date(d);return dt.toLocaleString()};const setAuthMsg=m=>$('authMsg').textContent=m;
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalWrap').classList.add('show')};function closeModal(){$('modalWrap').classList.remove('show');if(commentsUnsub){commentsUnsub();commentsUnsub=null}}$('modalClose').onclick=closeModal;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
function go(section){activeSection=section;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(section)?.classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));if(section==='profile')renderProfile(user.uid);if(section==='discover')renderDiscover();if(section==='chat')loadChatList();if(section==='notifications')loadNotifications();if(section==='settings'){} window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.section));$('searchBtn').onclick=()=>{go('discover');$('discoverSearch').focus()};$('notifBtn').onclick=()=>go('notifications');$('createBtn').onclick=()=>createPostModal();$('quickCompose').onclick=()=>createPostModal();$('addStory').onclick=()=>toast('Story creation will be enabled with media storage setup.');
$('signinTab').onclick=()=>{signup=false;$('authName').classList.add('hidden');$('authSubmit').textContent='Sign in';$('authPass').autocomplete='current-password'};$('signupTab').onclick=()=>{signup=true;$('authName').classList.remove('hidden');$('authSubmit').textContent='Create account';$('authPass').autocomplete='new-password'};$('authSubmit').onclick=async()=>{const email=$('authEmail').value.trim(),pass=$('authPass').value,name=$('authName').value.trim();if(!email||!pass||signup&&!name){setAuthMsg('Please complete the required fields.');return}try{if(signup){const cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,email,displayName:name,username:name.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20),bio:'',followers:[],following:[],savedPostIds:[],blockedUsers:[],createdAt:serverTimestamp()});}else await signInWithEmailAndPassword(auth,email,pass)}catch(e){setAuthMsg(e.message)}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('auth').classList.remove('hidden');$('app').classList.add('hidden');if(feedUnsub)feedUnsub();if(notifUnsub)notifUnsub();chatUnsubs.forEach(fn=>fn());chatUnsubs=[];return} $('auth').classList.add('hidden');$('app').classList.remove('hidden');await getUser(u.uid);$('homeAvatar').textContent=initials(u.displayName);loadFeed();loadUnreadChatBadge();loadNotificationsBadge();go('home')});
function createPostModal(){if(!user)return;openModal('Create a post',`<textarea id="postText" class="input" placeholder="Share something with your community..."></textarea><input id="postMediaUrl" class="input" style="margin-top:9px" placeholder="Optional photo/video URL (media storage not configured)"><select id="postType" class="input" style="margin-top:9px"><option value="post">Post</option><option value="video">Video</option></select><p class="small">Gallery/camera upload needs Firebase Storage setup. URL media and text posts can be saved now.</p><button class="primary" id="publishPost" style="width:100%;margin-top:10px">Publish</button>`);$('publishPost').onclick=publishPost}
async function publishPost(){const text=$('postText').value.trim(),mediaUrl=$('postMediaUrl').value.trim(),type=$('postType').value;if(!text&&!mediaUrl){toast('Add text or a media URL first');return}try{await addDoc(collection(db,'posts'),{userId:user.uid,userName:user.displayName||'User',username:user.displayName||'User',text,mediaUrl,type,likes:[],reposts:[],createdAt:serverTimestamp(),visibility:'public'});closeModal();toast('Post published');}catch(e){toast('Could not publish: '+e.message)}}
function mediaHtml(url){if(!url)return '';const safe=esc(url);const isVideo=/\.(mp4|webm|mov)(\?|$)/i.test(url);return isVideo?`<video class="media" controls playsinline src="${safe}"></video>`:`<img class="media" loading="lazy" src="${safe}" alt="Post media" onerror="this.style.display='none'">`}
function postHtml(p){const liked=(p.likes||[]).includes(user.uid),saved=(usersCache[user.uid]?.savedPostIds||[]).includes(p.id),author=usersCache[p.userId]||{},isOwn=p.userId===user.uid,isFollowing=(usersCache[user.uid]?.following||[]).includes(p.userId);return `<article class="card" data-post="${esc(p.id)}"><div class="row between"><div class="row" onclick="window.interchatProfile('${esc(p.userId)}')" style="cursor:pointer" title="View profile"><div class="avatar">${esc(initials(p.userName||author.displayName))}</div><div><strong>${esc(p.userName||author.displayName||'User')}</strong><div class="small">${esc(stamp(p.createdAt))}</div></div></div><div class="row">${isOwn?'':`<button class="secondary followbtn" onclick="window.interchatFollowFromPost('${esc(p.userId)}',event)">${isFollowing?'Following':'Follow'}</button>`}<button class="secondary" onclick="window.interchatPostMenu('${esc(p.id)}')">•••</button></div></div>${p.text?`<div class="posttext">${esc(p.text)}</div>`:''}${p.mediaUrl?mediaHtml(p.mediaUrl):''}<div class="actions"><button class="${liked?'liked':''}" onclick="window.interchatLike('${esc(p.id)}')">${liked?'♥':'♡'} ${p.likes?.length||0}</button><button onclick="window.interchatComments('${esc(p.id)}')">◯ ${p.commentCount||0}</button><button onclick="window.interchatRepost('${esc(p.id)}')">↻ ${p.reposts?.length||0}</button><button onclick="window.interchatShare('${esc(p.id)}')">↗ Share</button><button onclick="window.interchatSave('${esc(p.id)}')">${saved?'▣':'□'}</button></div></article>`}
window.interchatLike=async id=>{try{const r=doc(db,'posts',id),snap=await getDoc(r);if(!snap.exists())return;const likes=snap.data().likes||[];await updateDoc(r,{likes:likes.includes(user.uid)?arrayRemove(user.uid):arrayUnion(user.uid)}); }catch(e){toast('Like failed')}};window.interchatComments=id=>commentsModal(id);window.interchatRepost=async id=>{try{const r=doc(db,'posts',id),s=await getDoc(r);if(!s.exists())return;const arr=s.data().reposts||[];await updateDoc(r,{reposts:arr.includes(user.uid)?arrayRemove(user.uid):arrayUnion(user.uid)});toast(arr.includes(user.uid)?'Repost removed':'Reposted')}catch(e){toast('Repost failed')}};window.interchatSave=async id=>{const ref=doc(db,'users',user.uid),snap=await getDoc(ref),arr=snap.data()?.savedPostIds||[];await updateDoc(ref,{savedPostIds:arr.includes(id)?arrayRemove(id):arrayUnion(id)});usersCache[user.uid].savedPostIds=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];toast(arr.includes(id)?'Removed from saved':'Saved')};window.interchatShare=async id=>{const url=location.href.split('#')[0]+'#post-'+id;if(navigator.share){try{await navigator.share({title:'INTERCHAT post',url})}catch{}}else{await navigator.clipboard?.writeText(url);toast('Post link copied')}};window.interchatPostMenu=id=>openModal('Post options',`<button class="secondary settingsitem" onclick="window.interchatReport('${esc(id)}')">Report post</button><button class="secondary settingsitem" onclick="window.interchatHide('${esc(id)}')">Hide post</button>`);window.interchatReport=async id=>{await addDoc(collection(db,'reports'),{reporterId:user.uid,postId:id,createdAt:serverTimestamp(),status:'open'});closeModal();toast('Report submitted')};window.interchatHide=id=>{feedPosts=feedPosts.filter(p=>p.id!==id);renderFeed();closeModal();toast('Post hidden from this view')};window.interchatProfile=id=>renderProfile(id);
function loadFeed(){if(feedUnsub)feedUnsub();const q=query(collection(db,'posts'),orderBy('createdAt','desc'),limit(100));feedUnsub=onSnapshot(q,s=>{feedPosts=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed();},e=>toast('Feed error: '+e.message))};function renderFeed(){const f=$('feed');if(!f)return;f.innerHTML=feedPosts.length?feedPosts.map(postHtml).join(''):`<div class="empty">Nothing here yet. Start the conversation by creating a post.</div>`;if(activeSection==='discover')renderDiscover()}
let lastTap=0;document.addEventListener('click',e=>{const article=e.target.closest('[data-post]');if(!article||e.target.closest('button')||e.target.closest('video'))return;const now=Date.now();if(now-lastTap<320){window.interchatLike(article.dataset.post);article.classList.add('double-liked');toast('Liked ♥')}lastTap=now});
async function commentsModal(postId){openModal('Comments',`<div class="commentlist" id="commentList"><div class="empty">Loading comments…</div></div><div class="commentform"><input id="commentInput" class="input" placeholder="Write a comment…"><button class="primary" id="sendComment">Send</button></div>`);const q=query(collection(db,'posts',postId,'comments'),orderBy('createdAt','asc'));commentsUnsub=onSnapshot(q,s=>{$('commentList').innerHTML=s.docs.length?s.docs.map(d=>{const c=d.data();return `<div class="comment"><strong>${esc(c.userName||'User')}</strong><div>${esc(c.text||'')}</div><div class="small">${esc(stamp(c.createdAt))}</div></div>`}).join(''):`<div class="empty">Be the first to comment.</div>`},e=>toast('Comments error'));$('sendComment').onclick=async()=>{const text=$('commentInput').value.trim();if(!text)return;try{await addDoc(collection(db,'posts',postId,'comments'),{userId:user.uid,userName:user.displayName||'User',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',postId),{commentCount:increment(1)});$('commentInput').value=''}catch(e){toast('Comment failed: '+e.message)}};$('commentInput').onkeydown=e=>{if(e.key==='Enter')$('sendComment').click()}}
async function getUser(uid){if(usersCache[uid])return usersCache[uid];const s=await getDoc(doc(db,'users',uid));usersCache[uid]=s.exists()?s.data():{uid,displayName:'User'};return usersCache[uid]}
async function renderProfile(uid){currentProfile=uid;const p=await getUser(uid),own=uid===user.uid,posts=feedPosts.filter(x=>x.userId===uid);if(!own){const q=query(collection(db,'posts'),where('userId','==',uid),orderBy('createdAt','desc'),limit(80));const s=await getDocs(q);posts.splice(0,posts.length,...s.docs.map(d=>({id:d.id,...d.data()})))}const followers=p.followers||[],following=p.following||[],isFollowing=following.includes(user.uid);$('profileContent').innerHTML=`<div class="card profilehead"><div class="avatar" style="width:76px;height:76px;margin:auto;font-size:24px">${esc(initials(p.displayName))}</div><h2>${esc(p.displayName||'User')}</h2><div class="small">@${esc(p.username||'member')}</div><p>${esc(p.bio||'')}</p><div class="stats"><div class="stat"><strong>${posts.length}</strong><span class="small">Posts</span></div><div class="stat"><strong>${followers.length}</strong><span class="small">Followers</span></div><div class="stat"><strong>${following.length}</strong><span class="small">Following</span></div><div class="stat"><strong>${posts.reduce((n,x)=>n+(x.likes?.length||0),0)}</strong><span class="small">Likes</span></div></div>${own?`<button class="secondary" id="editProfileBtn2">Edit profile</button><button class="secondary" id="settingsOpen">Settings</button>`:`<div class="row" style="justify-content:center"><button class="primary followbtn" id="followBtn">${isFollowing?'Following':'Follow'}</button><button class="secondary" id="messageUser">Message</button><button class="secondary" id="blockUser">Block</button></div>`}</div><div class="card"><h3>Posts</h3><div class="gridposts">${posts.map(x=>`<div class="tile" onclick="window.interchatOpenPost('${esc(x.id)}')">${x.mediaUrl?(/\.(mp4|webm|mov)/i.test(x.mediaUrl)?`<video src="${esc(x.mediaUrl)}"></video>`:`<img src="${esc(x.mediaUrl)}">`):`<span>✎</span>`}</div>`).join('')||'<div class="small">No posts yet.</div>'}</div></div>`;if(own){$('editProfileBtn2').onclick=editProfile;$('settingsOpen').onclick=()=>go('settings')}else{$('followBtn').onclick=()=>followUser(uid);$('messageUser').onclick=()=>startChat(uid,p);$('blockUser').onclick=()=>blockUser(uid)}}
window.interchatOpenPost=id=>{const p=feedPosts.find(x=>x.id===id);if(p)openModal('Post',postHtml(p))};async function editProfile(){const p=await getUser(user.uid);openModal('Edit profile',`<input class="input" id="editDisplay" value="${esc(p.displayName||'')}" placeholder="Display name"><input class="input" id="editUsername" style="margin-top:8px" value="${esc(p.username||'')}" placeholder="Username"><textarea class="input" id="editBio" style="margin-top:8px" placeholder="Bio">${esc(p.bio||'')}</textarea><button class="primary" id="saveProfile" style="width:100%;margin-top:10px">Save</button>`);$('saveProfile').onclick=async()=>{const displayName=$('editDisplay').value.trim(),username=$('editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),bio=$('editBio').value.trim();if(!displayName||!username){toast('Name and username required');return}await updateDoc(doc(db,'users',user.uid),{displayName,username,bio});usersCache[user.uid]={...p,displayName,username,bio};await updateProfile(user,{displayName});closeModal();renderProfile(user.uid)}}
async function followUser(uid){const ref=doc(db,'users',user.uid),snap=await getDoc(ref),arr=snap.data()?.following||[],follow=arr.includes(uid);await updateDoc(ref,{following:follow?arrayRemove(uid):arrayUnion(uid)});const target=doc(db,'users',uid),ts=await getDoc(target);if(ts.exists())await updateDoc(target,{followers:follow?arrayRemove(user.uid):arrayUnion(user.uid)});usersCache[user.uid]={...(usersCache[user.uid]||snap.data()||{}),following:follow?arr.filter(x=>x!==uid):[...arr,uid]};if(usersCache[uid])usersCache[uid]={...usersCache[uid],followers:follow?(usersCache[uid].followers||[]).filter(x=>x!==user.uid):[...(usersCache[uid].followers||[]),user.uid]};toast(follow?'Unfollowed':'Following');if(activeSection==='profile')renderProfile(uid);else renderFeed()}window.interchatFollowFromPost=async(uid,e)=>{e?.stopPropagation();try{await followUser(uid)}catch(err){toast('Follow failed: '+err.message)}};
async function blockUser(uid){const ref=doc(db,'users',user.uid);await updateDoc(ref,{blockedUsers:arrayUnion(uid)});usersCache[user.uid].blockedUsers=[...(usersCache[user.uid].blockedUsers||[]),uid];closeModal();toast('User blocked');go('profile')}
function renderDiscover(){const term=$('discoverSearch').value.trim().toLowerCase();if(discoverMode==='people'){renderPeople(term);return}let list=feedPosts.filter(p=>discoverMode==='video'?p.type==='video'||/\.(mp4|webm|mov)/i.test(p.mediaUrl||''):true);if(term)list=list.filter(p=>(p.text||'').toLowerCase().includes(term)||(p.userName||'').toLowerCase().includes(term));$('discoverContent').innerHTML=list.length?list.map(postHtml).join(''):`<div class="empty">No content found.</div>`}document.querySelectorAll('[data-discover]').forEach(b=>b.onclick=()=>{discoverMode=b.dataset.discover;renderDiscover()});$('discoverSearch').oninput=()=>renderDiscover();async function renderPeople(term){const s=await getDocs(query(collection(db,'users'),limit(60)));const people=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==user.uid&&(!term||(p.displayName||'').toLowerCase().includes(term)||(p.username||'').toLowerCase().includes(term)));$('discoverContent').innerHTML=people.length?people.map(p=>`<div class="card row between"><div class="row" onclick="window.interchatProfile('${esc(p.id)}')"><div class="avatar">${esc(initials(p.displayName))}</div><div><strong>${esc(p.displayName||'User')}</strong><div class="small">@${esc(p.username||'member')}</div></div></div><button class="secondary" onclick="window.interchatProfile('${esc(p.id)}')">View</button></div>`).join(''):`<div class="empty">No people found.</div>`}
async function startChat(uid,p){currentChat={uid,p};go('chat');$('chatList').classList.add('hidden');$('chatRoom').classList.add('show');$('chatTitle').textContent=p.displayName||'Chat';$('chatUserProfile').onclick=()=>renderProfile(uid);loadMessages(uid)}function chatId(a,b){return[a,b].sort().join('_')}function loadChatList(){if(!user)return;$('chatRoom').classList.remove('show');$('chatList').classList.remove('hidden');getDocs(query(collection(db,'chats'),where('members','array-contains',user.uid),limit(50))).then(async s=>{const items=[];for(const d of s.docs){const c=d.data(),other=c.members.find(x=>x!==user.uid),p=await getUser(other);items.push({id:d.id,other,p,last:c.lastMessage||''})}items.sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));$('chatList').innerHTML=items.length?items.map(x=>`<div class="card row" onclick="window.interchatStartChat('${esc(x.other)}')"><div class="avatar">${esc(initials(x.p.displayName))}</div><div style="flex:1"><strong>${esc(x.p.displayName||'User')}</strong><div class="small">${esc(x.last)}</div></div></div>`).join(''):`<div class="empty">Your conversations will appear here. Open a profile and tap Message to start.</div>`})}window.interchatStartChat=async uid=>startChat(uid,await getUser(uid));$('backChats').onclick=()=>{currentChat=null;loadChatList()};async function loadMessages(uid){if(chatUnsub)chatUnsub();const cid=chatId(user.uid,uid),q=query(collection(db,'chats',cid,'messages'),orderBy('createdAt','asc'),limit(100));chatUnsub=onSnapshot(q,s=>{$('messages').innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.senderId===user.uid?'mine':''}">${esc(m.text)}<div class="small">${esc(stamp(m.createdAt))}</div></div>`}).join('');$('messages').scrollTop=$('messages').scrollHeight},e=>toast('Chat load error: '+e.message))}async function sendMessage(){const text=$('chatInput').value.trim();if(!text||!currentChat)return;const cid=chatId(user.uid,currentChat.uid);try{await setDoc(doc(db,'chats',cid),{members:[user.uid,currentChat.uid],lastMessage:text,lastAt:serverTimestamp()},{merge:true});await addDoc(collection(db,'chats',cid,'messages'),{senderId:user.uid,text,createdAt:serverTimestamp()});$('chatInput').value=''}catch(e){toast('Message failed: '+e.message)}}$('sendChat').onclick=sendMessage;$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};function loadUnreadChatBadge(){// Badge will show a simple count of chat documents; exact unread tracking needs message read-state.
getDocs(query(collection(db,'chats'),where('members','array-contains',user.uid),limit(50))).then(s=>{const n=s.size;if(n){$('chatBadge').textContent=n;$('chatBadge').classList.remove('hidden')}})}
function loadNotifications(){const q=query(collection(db,'notifications'),where('userId','==',user.uid),orderBy('createdAt','desc'),limit(50));$('notificationList').innerHTML='<div class="empty">Loading…</div>';if(notifUnsub)notifUnsub();notifUnsub=onSnapshot(q,s=>{$('notificationList').innerHTML=s.docs.length?s.docs.map(d=>{const n=d.data();return `<div class="comment">${esc(n.text||'New activity')}<div class="small">${esc(stamp(n.createdAt))}</div></div>`}).join(''):`<div class="empty">You're all caught up.</div>`},e=>{$('notificationList').innerHTML='<div class="small">Notifications are not available yet.</div>'})}function loadNotificationsBadge(){getDocs(query(collection(db,'notifications'),where('userId','==',user.uid),limit(30))).then(s=>{if(s.size){$('notifBadge').textContent=s.size;$('notifBadge').classList.remove('hidden')}}).catch(()=>{})}
$('editProfileBtn').onclick=editProfile;$('myProfileBtn').onclick=()=>renderProfile(user.uid);$('savedBtn').onclick=async()=>{const s=await getDoc(doc(db,'users',user.uid)),ids=s.data()?.savedPostIds||[];const saved=feedPosts.filter(p=>ids.includes(p.id));openModal('Saved posts',saved.length?saved.map(postHtml).join(''):'<div class="empty">No saved posts yet.</div>')};$('themeBtn').onclick=()=>{themeLight=!themeLight;if(themeLight){document.documentElement.style.setProperty('--bg','#f3f5fb');document.documentElement.style.setProperty('--panel','#ffffff');document.documentElement.style.setProperty('--panel2','#e9edf7');document.documentElement.style.setProperty('--text','#151a27');document.documentElement.style.setProperty('--muted','#5d667a');document.documentElement.style.setProperty('--line','#d8deea')}else{['--bg','#080a12','--panel','#111522','--panel2','#171c2b','--text','#f5f6ff','--muted','#9ba5bd','--line','#252c40'].forEach((v,i,a)=>{if(i%2===0)document.documentElement.style.setProperty(v,a[i+1])})}toast('Theme changed')};$('privacyBtn').onclick=()=>openModal('Privacy & safety','<p>Protect your personal information. Block users who make you uncomfortable and report posts that violate community guidelines.</p><p class="small">Private-account and message-request controls will be added after the core database rules and UI are tested.</p>');$('blockedBtn').onclick=async()=>{const p=await getUser(user.uid),ids=p.blockedUsers||[];openModal('Blocked users',ids.length?ids.map(id=>`<div class="row between card"><span>${esc(id)}</span><button class="secondary" onclick="window.interchatUnblock('${esc(id)}')">Unblock</button></div>`).join(''):'<div class="empty">No blocked users.</div>')};window.interchatUnblock=async id=>{await updateDoc(doc(db,'users',user.uid),{blockedUsers:arrayRemove(id)});usersCache[user.uid].blockedUsers=(usersCache[user.uid].blockedUsers||[]).filter(x=>x!==id);toast('User unblocked');$('blockedBtn').click()};$('logoutBtn').onclick=()=>signOut(auth);
$('themeBtn').title='Toggle light/dark theme';
</script>
